name: Premium homepage live verification
on:
  push:
    branches: [fix/home-product-overview-premium-20260923]
    paths: [.github/workflows/home-overview-premium-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e664c2af3ee883220d07d2d70a6a103b677f903c
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live homepage and versioned stylesheet
        run: |
          mkdir -p .preview/premium-live
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,hashlib,re,json,time
          beacon_sha='08315641718ee2685c70859826a5267fb4594fb81d5a9a8a4d1328b2f0fe631d'
          report=[]
          for path in ['index.html','product-overview-v2.css']:
              url='https://marketdeck.in/'+('' if path=='index.html' else path)
              expected=Path('public',path).read_bytes()
              passed=False
              for attempt in range(1,5):
                  req=urllib.request.Request(url,headers={'User-Agent':'MarketDeck-Release-Verification/1.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=45) as r:
                      data=r.read();status=r.status;final=r.url
                  normalized=data
                  if path=='index.html' and data!=expected:
                      blocks=re.findall(rb'<script\b[^>]*src="https://static\.cloudflareinsights\.com/beacon\.min\.js/[^"<>]*"[^>]*></script>\n',data)
                      if len(blocks)==1 and hashlib.sha256(blocks[0]).hexdigest()==beacon_sha:
                          normalized=data.replace(blocks[0],b'',1)
                  row={'path':path,'attempt':attempt,'status':status,'finalURL':final,'sha256':hashlib.sha256(data).hexdigest(),'expectedSHA256':hashlib.sha256(expected).hexdigest(),'match':normalized==expected}
                  report.append(row);Path('.preview/premium-live/integrity.json').write_text(json.dumps(report,indent=2))
                  if status==200 and normalized==expected:passed=True;break
                  time.sleep(10)
              assert passed,report[-1]
          print('PASS: live homepage and dedicated premium stylesheet match production commit')
          PY
      - name: Install browser QA
        run: |
          npm ci
          npm install --no-save --package-lock=false @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Verify live cards render as cards
        run: |
          cat > .preview/premium-live/live.mjs <<'JS'
          import {chromium} from '@playwright/test';
          import AxeBuilder from '@axe-core/playwright';
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          const widths=[320,390,768,1440,1920],results=[];
          const browser=await chromium.launch();
          try{
            for(const width of widths){
              const context=await browser.newContext({viewport:{width,height:1000},reducedMotion:'reduce'});
              const page=await context.newPage();const errors=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              const response=await page.goto('https://marketdeck.in/',{waitUntil:'networkidle',timeout:60000});
              assert.equal(response.status(),200);
              const overview=page.locator('.suite-overview-section');
              const cards=overview.locator('.suite-overview-card');
              assert.equal(await cards.count(),5);
              const sheet=await page.evaluate(()=>[...document.styleSheets].some(s=>s.href?.includes('/product-overview-v2.css')));
              assert.equal(sheet,true);
              for(const card of await cards.all()){
                assert(await card.isVisible());
                const box=await card.boundingBox();assert(box&&box.width>250&&box.height>240,JSON.stringify({width,box}));
                const css=await card.evaluate(el=>{const s=getComputedStyle(el);return {display:s.display,border:s.borderTopWidth,radius:s.borderRadius}});
                assert.notEqual(css.border,'0px');assert.notEqual(css.radius,'0px');
                assert.equal(await card.locator('.suite-overview-art img').count(),1);
                assert.equal(await card.locator('.suite-overview-chips li').count(),3);
              }
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-innerWidth);
              assert(overflow<=1,`overflow ${overflow} at ${width}`);
              const scan=await new AxeBuilder({page}).include('.suite-overview-section').withTags(['wcag2a','wcag2aa','wcag21a','wcag21aa']).analyze();
              assert.equal(scan.violations.length,0,JSON.stringify(scan.violations));
              assert.deepEqual(errors,[]);
              if(width===390||width===1440)await overview.screenshot({path:`.preview/premium-live/live-${width}.png`});
              results.push({width,cards:5,overflow,axe:0});
              await context.close();
            }
            writeFileSync('.preview/premium-live/results.json',JSON.stringify({status:'PASS',results},null,2));
            console.log('PASS: live premium card rendering verified at five widths');
          }finally{await browser.close();}
          JS
          node .preview/premium-live/live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-homepage-live-verification
          path: .preview/premium-live/
          retention-days: 7
          if-no-files-found: error
