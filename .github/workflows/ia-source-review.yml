name: IA source and route evidence
on:
  push:
    branches: [feature/ia-hubs-deeplinks-20260923]
    paths: [.github/workflows/ia-source-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3a9f30dbec2d37ae3906fd169e5184e41533d31
      - name: Collect public source and route metadata without production mutations
        run: |
          mkdir -p audit-evidence
          git archive --format=tar HEAD > audit-evidence/marketdeck-web.tar
          python3 - <<'PY'
          import json, urllib.request, urllib.error, concurrent.futures
          from pathlib import Path
          out=Path('audit-evidence')
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'MarketDeck-IA-Audit/1.0'})
              with urllib.request.urlopen(req,timeout=35) as r:return r.read(),dict(r.headers),r.status,r.url
          def repo(name):
              base='https://api.github.com/repos/sarthakk-1126/'+name
              row={'repository':name}
              try:
                  m=json.loads(get(base)[0]);ref=m['default_branch']
                  c=json.loads(get(base+'/commits/'+ref)[0]);sha=c['sha']
                  row.update(defaultBranch=ref,sha=sha)
                  for key,path in [('branches','/branches?per_page=100'),('pulls','/pulls?state=open&per_page=100')]:
                      row[key]=json.loads(get(base+path)[0])
                  tar=get('https://codeload.github.com/sarthakk-1126/'+name+'/tar.gz/'+sha)[0]
                  (out/(name+'.tar.gz')).write_bytes(tar)
              except Exception as e: row['error']=str(e)
              return row
          names=['stockproof','charting-v1','fo-analytics-v1','market-commentary-v1','crypto-tools-v1']
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:rows=list(pool.map(repo,names))
          (out/'repositories.json').write_text(json.dumps(rows,indent=2))
          routes=['/','/intelligence/','/intelligence/issues/','/screener/','/charts/','/futures-and-options/','/commentary/','/crypto/','/robots.txt','/sitemap.xml']
          def page(path):
              row={'path':path}
              try:
                  data,headers,status,final=get('https://marketdeck.in'+path)
                  key=path.strip('/').replace('/','_') or 'home'
                  (out/(key+'.html')).write_bytes(data)
                  row.update(http=status,finalURL=final,headers={k:v for k,v in headers.items() if k.lower() in ['content-type','link','x-robots-tag','location','cf-cache-status']},bytes=len(data))
              except urllib.error.HTTPError as e:row.update(http=e.code,error=str(e))
              except Exception as e:row['error']=str(e)
              return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:pages=list(pool.map(page,routes))
          (out/'routes.json').write_text(json.dumps(pages,indent=2))
          print(json.dumps({'repositories':[{k:r.get(k) for k in ['repository','sha','error']} for r in rows],'routes':pages},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: marketdeck-ia-source-evidence
          path: audit-evidence/
          retention-days: 7
          if-no-files-found: error
