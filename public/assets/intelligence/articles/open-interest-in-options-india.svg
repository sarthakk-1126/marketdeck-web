<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">Four price and open-interest observations</title><desc id="d">Original schematic: price rises with OI rises is commonly labelled long buildup; price falls with OI rises short buildup; price rises with OI falls short covering; price falls with OI falls long unwinding. These are descriptive heuristics, not proof of market participant intent or trade signals.</desc><rect width="960" height="480" rx="16" fill="#0d1722"/><path d="M32 88H928" stroke="#2b3d4e"/><text x="32" y="39" font-family="Arial,sans-serif" font-size="15" fill="#8fbce2">MARKETDECK / RESEARCH EXAMPLE</text><text x="32" y="72" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">Four price and open-interest observations</text><rect x="34" y="132" width="426" height="138" rx="8" fill="#162c3d"/><rect x="46" y="147" width="6" height="106" fill="#376e64"/><text x="70" y="179" font-family="Arial,sans-serif" font-size="22" fill="#f4f4f0">LONG BUILDUP</text><text x="70" y="227" font-family="Arial,sans-serif" font-size="20" fill="#acc0c8">PRICE UP  /  OI UP</text><rect x="500" y="132" width="426" height="138" rx="8" fill="#162c3d"/><rect x="512" y="147" width="6" height="106" fill="#915d57"/><text x="536" y="179" font-family="Arial,sans-serif" font-size="22" fill="#f4f4f0">SHORT BUILDUP</text><text x="536" y="227" font-family="Arial,sans-serif" font-size="20" fill="#acc0c8">PRICE DOWN  /  OI UP</text><rect x="34" y="291" width="426" height="138" rx="8" fill="#162c3d"/><rect x="46" y="306" width="6" height="106" fill="#376e64"/><text x="70" y="338" font-family="Arial,sans-serif" font-size="22" fill="#f4f4f0">SHORT COVERING</text><text x="70" y="386" font-family="Arial,sans-serif" font-size="20" fill="#acc0c8">PRICE UP  /  OI DOWN</text><rect x="500" y="291" width="426" height="138" rx="8" fill="#162c3d"/><rect x="512" y="306" width="6" height="106" fill="#915d57"/><text x="536" y="338" font-family="Arial,sans-serif" font-size="22" fill="#f4f4f0">LONG UNWINDING</text><text x="536" y="386" font-family="Arial,sans-serif" font-size="20" fill="#acc0c8">PRICE DOWN  /  OI DOWN</text><text x="38" y="467" font-family="Arial,sans-serif" font-size="15" fill="#9fb6c6">Context only · use comparable instrument, timestamp and contract units</text></svg>