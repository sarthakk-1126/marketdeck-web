name: Authored article snapshot
on:
  push:
    branches: [editorial/seo-foundations-20260923]
    paths: [.github/workflows/seo-authored-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p /tmp/authored
          git archive --format=tar HEAD content/articles > /tmp/authored/articles.tar
      - uses: actions/upload-artifact@v4
        with:
          name: seo-authored-articles
          path: /tmp/authored/
          retention-days: 3
          if-no-files-found: error
