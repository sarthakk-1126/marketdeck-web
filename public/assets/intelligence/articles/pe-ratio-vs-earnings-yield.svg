<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">One relationship, two directions</title><desc id="d">Hypothetical examples show P/E and earnings yield as reciprocals when earnings are positive: 10x equals 10%, 20x equals 5%, and 25x equals 4%. This is not a return forecast.</desc><rect width="960" height="480" rx="16" fill="#0d1722"/><path d="M32 88H928" stroke="#2b3d4e"/><text x="32" y="39" font-family="Arial,sans-serif" font-size="15" fill="#8fbce2">MARKETDECK / RESEARCH EXAMPLE</text><text x="32" y="72" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">One relationship, two directions</text><text x="54" y="171" font-family="Arial,sans-serif" font-size="24" fill="#edf1f6">10× P/E</text><path d="M238 163 L470 163" fill="none" stroke="#456987" stroke-width="3"/><text x="510" y="171" font-family="Arial,sans-serif" font-size="24" fill="#9bc7ed">10% earnings yield</text><text x="54" y="259" font-family="Arial,sans-serif" font-size="24" fill="#edf1f6">20× P/E</text><path d="M238 251 L470 251" fill="none" stroke="#456987" stroke-width="3"/><text x="510" y="259" font-family="Arial,sans-serif" font-size="24" fill="#9bc7ed">5% earnings yield</text><text x="54" y="347" font-family="Arial,sans-serif" font-size="24" fill="#edf1f6">25× P/E</text><path d="M238 339 L470 339" fill="none" stroke="#456987" stroke-width="3"/><text x="510" y="347" font-family="Arial,sans-serif" font-size="24" fill="#9bc7ed">4% earnings yield</text><text x="54" y="430" font-family="Arial,sans-serif" font-size="18" fill="#c8d6e5">Reciprocal relationship only · earnings quality and period still need research</text></svg>