<svg xmlns="http://www.w3.org/2000/svg" width="560" height="800" viewBox="0 0 560 800" role="img" aria-labelledby="title desc"><title id="title">Independent holdout breach rates</title><desc id="desc">Mean breach percentages for each method and generated distribution. Target: 1%. Same data as desktop figure and accessible comparison table.</desc><rect width="560" height="800" fill="#0d1420"/><g font-family="Arial,sans-serif" fill="#dbe5f2"><text x="22" y="38" font-size="24">Independent holdout breach rates</text><text x="22" y="68" font-size="17">n = 1,260 · 8,000 repetitions · 99% confidence</text><path d="M30 108V654" stroke="#293548"/><text x="30" y="681" font-size="17" text-anchor="middle">0.0</text><path d="M90 108V654" stroke="#293548"/><text x="90" y="681" font-size="17" text-anchor="middle">0.5</text><path d="M150 108V654" stroke="#293548"/><text x="150" y="681" font-size="17" text-anchor="middle">1.0</text><path d="M210 108V654" stroke="#293548"/><text x="210" y="681" font-size="17" text-anchor="middle">1.5</text><path d="M270 108V654" stroke="#293548"/><text x="270" y="681" font-size="17" text-anchor="middle">2.0</text><path d="M330 108V654" stroke="#293548"/><text x="330" y="681" font-size="17" text-anchor="middle">2.5</text><path d="M390 108V654" stroke="#293548"/><text x="390" y="681" font-size="17" text-anchor="middle">3.0</text><path d="M450 108V654" stroke="#293548"/><text x="450" y="681" font-size="17" text-anchor="middle">3.5</text><path d="M150 106V654" stroke="#fff" stroke-dasharray="6 4"/><text x="158" y="104" font-size="17">1% target</text><text x="22" y="126" font-size="22">Normal</text><rect x="30" y="140" width="129.117" height="20" fill="#8fbcff"/><text x="167.117" y="157" font-size="18">1.076</text><rect x="30" y="169" width="121.01099999999997" height="20" fill="#67d8c1"/><text x="159.01099999999997" y="186" font-size="18">1.008</text><rect x="30" y="198" width="123.27825000000001" height="20" fill="#f4bb79"/><text x="161.27825" y="215" font-size="18">1.027</text><text x="22" y="259" font-size="22">Negative skew</text><rect x="30" y="273" width="128.703" height="20" fill="#8fbcff"/><text x="166.703" y="290" font-size="18">1.073</text><rect x="30" y="302" width="310.71375" height="20" fill="#67d8c1"/><text x="348.71375" y="319" font-size="18">2.589</text><rect x="30" y="331" width="131.86574999999996" height="20" fill="#f4bb79"/><text x="169.86574999999996" y="348" font-size="18">1.099</text><text x="22" y="392" font-size="22">Fat tails</text><rect x="30" y="406" width="128.87925" height="20" fill="#8fbcff"/><text x="166.87925" y="423" font-size="18">1.074</text><rect x="30" y="435" width="167.00925" height="20" fill="#67d8c1"/><text x="205.00925" y="452" font-size="18">1.392</text><rect x="30" y="464" width="101.57249999999999" height="20" fill="#f4bb79"/><text x="139.5725" y="481" font-size="18">0.846</text><text x="22" y="525" font-size="22">Skew and fat tails</text><rect x="30" y="539" width="129.04874999999998" height="20" fill="#8fbcff"/><text x="167.04874999999998" y="556" font-size="18">1.075</text><rect x="30" y="568" width="373.1580000000001" height="20" fill="#67d8c1"/><text x="411.1580000000001" y="585" font-size="18">3.110</text><rect x="30" y="597" width="130.026" height="20" fill="#f4bb79"/><text x="168.026" y="614" font-size="18">1.084</text><text x="22" y="718" font-size="18">Mean holdout breach rate (%)</text><rect x="22" y="751" width="14" height="14" fill="#8fbcff"/><text x="42" y="765" font-size="16">Historical</text><rect x="199" y="751" width="14" height="14" fill="#67d8c1"/><text x="219" y="765" font-size="16">Gaussian</text><rect x="376" y="751" width="14" height="14" fill="#f4bb79"/><text x="396" y="765" font-size="16">Cornish-Fisher</text></g></svg>