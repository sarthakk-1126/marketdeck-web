name: Editorial source snapshot
on:
  push:
    branches: [editorial/seo-foundations-20260923]
    paths: [.github/workflows/seo-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 556ecc6e9ad02ae777d3c9746faf874f22658db8
          persist-credentials: false
      - name: Export reviewed production base only
        run: |
          mkdir -p /tmp/editorial-snapshot
          git archive --format=tar HEAD > /tmp/editorial-snapshot/source.tar
          git rev-parse HEAD > /tmp/editorial-snapshot/base-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: seo-editorial-source
          path: /tmp/editorial-snapshot/
          retention-days: 3
          if-no-files-found: error
