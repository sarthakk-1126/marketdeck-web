name: Intelligence library live verification
on:
  push:
    branches: [ia/intelligence-library-20260923]
    paths: [.github/workflows/intelligence-library-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 54f9df91360552ad77a68bf5aecfc4893bc43259
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public HTML and sitemap match the production commit
        run: |
          mkdir -p .preview/intelligence-library-live
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,hashlib,re,json,time
          beacon_sha='08315641718ee2685c70859826a5267fb4594fb81d5a9a8a4d1328b2f0fe631d'
          paths=[
            ('intelligence/library/index.html','https://marketdeck.in/intelligence/library/'),
            ('intelligence/issues/index.html','https://marketdeck.in/intelligence/issues/'),
            ('intelligence/index.html','https://marketdeck.in/intelligence/'),
            ('sitemap.xml','https://marketdeck.in/sitemap.xml'),
            ('intelligence-shelf-v1.css','https://marketdeck.in/intelligence-shelf-v1.css'),
            ('intelligence-shelf-v1.js','https://marketdeck.in/intelligence-shelf-v1.js'),
          ]
          report=[]
          for path,url in paths:
              expected=Path('public',path).read_bytes()
              passed=False
              for attempt in range(1,7):
                  req=urllib.request.Request(url,headers={'User-Agent':'MarketDeck-Release-Verification/1.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=45) as r:
                      data=r.read();status=r.status;final=r.url
                  normalized=data
                  exception=None
                  if path.endswith('.html') and data!=expected:
                      blocks=re.findall(rb'<script\b[^>]*src="https://static\.cloudflareinsights\.com/beacon\.min\.js/[^"<>]*"[^>]*></script>\n',data)
                      if len(blocks)==1 and hashlib.sha256(blocks[0]).hexdigest()==beacon_sha:
                          normalized=data.replace(blocks[0],b'',1)
                          exception='Single exact previously inspected Cloudflare analytics injection.'
                  row={'path':path,'url':url,'attempt':attempt,'status':status,'finalURL':final,'actualSHA256':hashlib.sha256(data).hexdigest(),'expectedSHA256':hashlib.sha256(expected).hexdigest(),'reviewedContentMatch':normalized==expected,'exception':exception}
                  report.append(row)
                  Path('.preview/intelligence-library-live/integrity.json').write_text(json.dumps(report,indent=2))
                  if status==200 and final==url and normalized==expected:
                      passed=True
                      break
                  if attempt<6:time.sleep(12)
              assert passed,report[-1]
          print('PASS: Library, magazine archive, Intelligence landing, sitemap and editorial assets match production commit.')
          PY
      - name: Install browser verification tools
        run: |
          npm ci
          npm install --no-save --package-lock=false @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Verify actual live Library UX
        run: |
          cat > .preview/intelligence-library-live/live.mjs <<'JS'
          import {chromium} from '@playwright/test';
          import AxeBuilder from '@axe-core/playwright';
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';

          const origin='https://marketdeck.in';
          const widths=[320,390,768,1440,1920],results=[];
          const browser=await chromium.launch();
          try{
            for(const width of widths){
              const context=await browser.newContext({viewport:{width,height:1000},reducedMotion:'reduce'});
              const page=await context.newPage();const errors=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              const response=await page.goto(origin+'/intelligence/library/',{waitUntil:'networkidle',timeout:60000});
              assert.equal(response.status(),200);
              assert.equal(page.url(),origin+'/intelligence/library/');
              assert.equal(await page.locator('h1').count(),1);
              assert.equal(await page.locator('link[rel="canonical"][href="'+origin+'/intelligence/library/"]').count(),1);

              const entries=page.locator('[data-intel-entry]');
              assert.equal(await entries.count(),11);
              assert.equal(await page.locator('[data-intel-entry][data-kind="magazine"]').count(),1);
              assert.equal(await page.locator('[data-intel-entry][data-kind="note"]').count(),10);
              assert.equal(await page.getByText('Start with the evidence',{exact:true}).count(),0);
              const visibleCount=async()=>await entries.evaluateAll(xs=>xs.filter(x=>!x.hidden).length);
              assert.equal(await visibleCount(),11);

              await page.getByRole('button',{name:'Magazines',exact:true}).click();
              assert.equal(await visibleCount(),1);
              await page.getByRole('button',{name:'Learning Notes',exact:true}).click();
              assert.equal(await visibleCount(),10);
              await page.getByRole('button',{name:'All Research',exact:true}).click();
              assert.equal(await visibleCount(),11);
              await page.locator('[data-intel-search]').fill('Support vs Resistance');
              await page.waitForTimeout(180);
              assert.equal(await visibleCount(),1);
              await page.getByRole('button',{name:'Reset filters',exact:true}).click();
              assert.equal(await visibleCount(),11);

              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-innerWidth);
              assert(overflow<=1,`overflow ${overflow}px at ${width}`);
              const scan=await new AxeBuilder({page}).include('.intel-page-main').withTags(['wcag2a','wcag2aa','wcag21a','wcag21aa']).analyze();
              assert.equal(scan.violations.length,0,JSON.stringify(scan.violations));
              assert.deepEqual(errors,[]);

              if(width===390){
                const hrefs=[...new Set(await entries.locator('h3 a[href]').evaluateAll(xs=>xs.map(x=>x.href)))];
                assert.equal(hrefs.length,11);
                for(const href of hrefs){const r=await context.request.get(href);assert.equal(r.status(),200,href);}
                const magazine=await context.request.get(origin+'/intelligence/issues/');
                assert.equal(magazine.status(),200);
                const sitemap=await context.request.get(origin+'/sitemap.xml');
                assert.equal(sitemap.status(),200);
                assert((await sitemap.text()).includes('<loc>https://marketdeck.in/intelligence/library/</loc>'));
              }

              if(width===390||width===1440)await page.screenshot({path:`.preview/intelligence-library-live/library-live-${width}.png`,fullPage:true});
              results.push({width,entries:11,overflow,axe:0,consoleErrors:0});
              await context.close();
            }

            const nojs=await browser.newContext({javaScriptEnabled:false,viewport:{width:390,height:1000}});
            const page=await nojs.newPage();
            const response=await page.goto(origin+'/intelligence/library/');
            assert.equal(response.status(),200);
            assert.equal(await page.locator('[data-intel-entry]').count(),11);
            assert.equal(await page.locator('[data-intel-entry][hidden]').count(),0);
            assert.equal(await page.locator('[data-intel-library-tools]:visible').count(),0);
            assert.equal(await page.locator('[data-intel-kind-filters]:visible').count(),0);
            assert.equal(await page.locator('a[href="/intelligence/issues/agentic-trading-frontier-2026/"]').count(),2);
            await nojs.close();

            const issueContext=await browser.newContext({viewport:{width:390,height:1000},reducedMotion:'reduce'});
            const issue=await issueContext.newPage();
            await issue.goto(origin+'/intelligence/issues/',{waitUntil:'networkidle'});
            assert.equal(await issue.locator('[data-intel-entry]').count(),1);
            assert.equal(await issue.getByText('Start with the evidence',{exact:true}).count(),0);
            assert.equal(await issue.locator('a[href="/intelligence/library/"]').count()>0,true);
            await issue.screenshot({path:'.preview/intelligence-library-live/magazine-live-390.png',fullPage:true});
            await issueContext.close();

            writeFileSync('.preview/intelligence-library-live/results.json',JSON.stringify({status:'PASS',results,noJS:11,magazineEntries:1},null,2));
            console.log('PASS: live Library verified at five widths with filters, links, accessibility, no-JS and magazine separation.');
          }finally{await browser.close();}
          JS
          node .preview/intelligence-library-live/live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intelligence-library-live-verification
          path: .preview/intelligence-library-live/
          retention-days: 7
          if-no-files-found: error
