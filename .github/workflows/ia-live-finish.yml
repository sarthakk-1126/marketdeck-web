name: Verify IA live editorial assets
on:
  push:
    branches: [feature/ia-hubs-deeplinks-20260923]
    paths: [.github/workflows/ia-live-finish.yml]
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 95fbe8f688d4efdd03e881f7f32ea4d2a7135448
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify actual images, including lazy-loaded magazine covers
        run: |
          mkdir -p .preview/ia-assets
          cat > .preview/ia-asset-check.mjs <<'JS'
          import {chromium} from '@playwright/test';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const root='https://marketdeck.in',out='.preview/ia-assets',browser=await chromium.launch();
          const paths=['/','/intelligence/','/intelligence/issues/','/intelligence/issues/agentic-trading-frontier-2026/','/intelligence/equities/','/intelligence/technical-analysis/','/intelligence/futures-options/','/intelligence/notes/pe-ratio-vs-earnings-yield/','/intelligence/notes/support-vs-resistance-stock-charts/','/intelligence/notes/call-option-vs-put-option-india/'];
          const report={origin:root,pages:[],assets:[],status:'RUNNING'},assets=new Set();
          try{
            const context=await browser.newContext({viewport:{width:1440,height:1000},reducedMotion:'reduce'});
            for(const path of paths){
              for(const width of [390,1440]){
                const page=await context.newPage();await page.setViewportSize({width,height:1000});const failures=[];page.on('requestfailed',r=>failures.push({url:r.url(),error:r.failure()?.errorText}));
                const response=await page.goto(root+path,{waitUntil:'networkidle',timeout:60000});assert.equal(response.status(),200,path);
                if(path==='/'){
                  // Existing home.js intentionally assigns preview src only when its native tab is selected.
                  // Exercise that UI, rather than interpreting inactive src-less placeholders as broken URLs.
                  const tabs=page.locator('.product-tabs [data-product]');assert.equal(await tabs.count(),5);
                  for(const tab of await tabs.all()){
                    const id=await tab.getAttribute('data-product');await tab.click();
                    const preview=page.locator(`[data-panel="${id}"] img[data-preview-src]`);
                    await preview.evaluate(async img=>{await img.decode();if(!img.naturalWidth)throw new Error('Preview failed: '+img.src);});
                  }
                  await tabs.first().click();await page.evaluate(()=>scrollTo(0,0));
                }
                const images=await page.evaluate(async()=>{
                  const imgs=[...document.images];for(const img of imgs)img.loading='eager';
                  return await Promise.all(imgs.map(async img=>{let error=null;try{await img.decode();}catch(e){error=String(e);}return {src:img.currentSrc||img.src,complete:img.complete,width:img.naturalWidth,height:img.naturalHeight,error};}));
                });
                const broken=images.filter(i=>!i.src||!i.complete||!i.width||i.error);
                const links=await page.locator('link[rel="stylesheet"][href],script[src]').evaluateAll(xs=>xs.map(x=>x.href||x.src));
                const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-innerWidth);
                report.pages.push({path,width,status:response.status(),images,broken,overflow,requestFailures:failures});
                writeFileSync(out+'/asset-results.json',JSON.stringify(report,null,2));
                if(path==='/intelligence/'||path==='/'||path.includes('/issues/'))await page.screenshot({path:out+'/'+(path.split('/').filter(Boolean).at(-1)||'home')+'-'+width+'.png',fullPage:true});
                assert.deepEqual(broken,[],path+' '+width+' broken images');assert(overflow<=1,path+' overflow');
                for(const link of [...images.map(i=>i.src),...links]){const u=new URL(link);if(u.origin===root)assets.add(u.pathname);}
                await page.close();
              }
            }
            for(const path of assets){
              const response=await context.request.get(root+path);assert.equal(response.status(),200,path);const actual=await response.body(),expected=readFileSync('public'+path);
              const row={path,status:response.status(),bytes:actual.length,sha256:createHash('sha256').update(actual).digest('hex'),reviewedSHA256:createHash('sha256').update(expected).digest('hex'),matchesReviewed:actual.equals(expected)};report.assets.push(row);writeFileSync(out+'/asset-results.json',JSON.stringify(report,null,2));assert(row.matchesReviewed,path+' asset differs');
            }
            report.status='PASS';console.log(JSON.stringify({status:report.status,viewportCases:report.pages.length,exactAssets:report.assets.length}));
            await context.close();
          }catch(e){report.status='FAIL';report.error=e.stack;throw e;}finally{writeFileSync(out+'/asset-results.json',JSON.stringify(report,null,2));await browser.close();}
          JS
          node .preview/ia-asset-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketdeck-ia-live-assets
          path: .preview/ia-assets/
          retention-days: 7
          if-no-files-found: error
