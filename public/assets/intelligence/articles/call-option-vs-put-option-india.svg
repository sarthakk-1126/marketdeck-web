<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">Call and put buyer profit / loss at expiry</title><desc id="d">Hypothetical cash-settled index options, per unit before costs. Strike 20,000, call premium 200, put premium 180. Call P/L = max(S − 20,000, 0) − 200; put P/L = max(20,000 − S, 0) − 180. Breakevens are 20,200 and 19,820. This is not a price forecast.</desc><rect width="960" height="480" rx="16" fill="#0d1722"/><path d="M32 88H928" stroke="#2b3d4e"/><text x="32" y="39" font-family="Arial,sans-serif" font-size="15" fill="#8fbce2">MARKETDECK / RESEARCH EXAMPLE</text><text x="32" y="72" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">Call and put buyer profit / loss at expiry</text><text x="50" y="118" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">P/L per unit (₹)</text><path d="M120 262 L824 262" fill="none" stroke="#456987" stroke-width="3"/><path d="M120 140 L120 355" fill="none" stroke="#456987" stroke-width="3"/><text x="60" y="360" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">-200</text><text x="60" y="268" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">0</text><text x="60" y="176" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">200</text><text x="95" y="389" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">19,600</text><text x="447" y="389" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">20,000</text><text x="799" y="389" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">20,400</text><path d="M120 354 L313.6 354 L472 354 L648 262 L824 170" fill="none" stroke="#72b9f9" stroke-width="4"/><path d="M120 160.8 L313.6 262 L472 344.8 L648 344.8 L824 344.8" fill="none" stroke="#f1a7be" stroke-width="4"/><text x="160" y="134" font-family="Arial,sans-serif" font-size="17" fill="#f3b7ca">PUT BUYER · ₹180 premium</text><text x="542" y="134" font-family="Arial,sans-serif" font-size="17" fill="#9bc7ed">CALL BUYER · ₹200 premium</text><text x="337" y="422" font-family="Arial,sans-serif" font-size="18" fill="#c8d6e5">Underlying index at expiry</text><text x="50" y="458" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">Synthetic example · no charges or lot multiplier · full premium loss is possible</text></svg>