name: Intelligence library build and QA
on:
  push:
    branches: [ia/intelligence-library-20260923]
    paths:
      - scripts/intelligence.mjs
      - scripts/editorial.mjs
      - scripts/articles.mjs
      - public/intelligence-shelf-v1.css
      - public/intelligence-shelf-v1.js
      - tests/intelligence.test.mjs
      - .github/workflows/intelligence-library-qa.yml
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build production and review fixtures
        run: |
          npm run build
          npm run build:review
          git diff --check
      - name: Run full source and test checks
        run: npm run check
      - name: Verify generated inventory and sitemap
        run: |
          node - <<'JS'
          const fs=require('fs');
          const lib=fs.readFileSync('public/intelligence/library/index.html','utf8');
          const archive=fs.readFileSync('public/intelligence/issues/index.html','utf8');
          const sitemap=fs.readFileSync('public/sitemap.xml','utf8');
          if((lib.match(/data-intel-entry /g)||[]).length!==11)throw Error('Library must contain 11 published entries');
          if((lib.match(/data-kind="magazine"/g)||[]).length!==1)throw Error('Library must contain 1 published magazine');
          if((lib.match(/data-kind="note"/g)||[]).length!==10)throw Error('Library must contain 10 published learning notes');
          if((archive.match(/data-intel-entry /g)||[]).length!==1)throw Error('Magazine archive must remain magazine-only');
          if(/research-foundations|EDITORIAL DRAFT/.test(lib+archive))throw Error('Draft content leaked into production');
          if(!sitemap.includes('https://marketdeck.in/intelligence/library/'))throw Error('Library missing from sitemap');
          console.log('PASS: 11 published items, 1 magazine, 10 learning notes; draft excluded.');
          JS
      - name: Install browser QA
        run: |
          npm install --no-save --package-lock=false @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Responsive, filter, no-JS, link and accessibility QA
        run: |
          mkdir -p .preview/intelligence-library
          python3 -m http.server 4173 -d public >/tmp/md-http.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/intelligence/library/ >/dev/null && break; sleep .5; done
          cat > .preview/intelligence-library/qa.mjs <<'JS'
          import {chromium} from '@playwright/test';
          import AxeBuilder from '@axe-core/playwright';
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          const widths=[320,390,768,1440,1920],results=[];
          const browser=await chromium.launch();
          try{
            for(const width of widths){
              const context=await browser.newContext({viewport:{width,height:1000},reducedMotion:'reduce'});
              const page=await context.newPage();const errors=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              const response=await page.goto('http://127.0.0.1:4173/intelligence/library/',{waitUntil:'networkidle'});
              assert.equal(response.status(),200);
              const entries=page.locator('[data-intel-entry]');
              assert.equal(await entries.count(),11);
              const visibleCount=async()=>await entries.evaluateAll(xs=>xs.filter(x=>!x.hidden).length);
              assert.equal(await visibleCount(),11);

              const kinds=page.locator('[data-intel-kind]');
              assert.equal(await kinds.count(),3);
              await page.getByRole('button',{name:'Magazines',exact:true}).click();
              assert.equal(await visibleCount(),1);
              assert.match(await page.locator('[data-intel-results]').textContent(),/^1 entry/);
              await page.getByRole('button',{name:'Learning Notes',exact:true}).click();
              assert.equal(await visibleCount(),10);
              await page.getByRole('button',{name:'All Research',exact:true}).click();
              assert.equal(await visibleCount(),11);

              const search=page.locator('[data-intel-search]');
              await search.fill('P/E Ratio vs Earnings Yield');
              await page.waitForTimeout(180);
              assert.equal(await visibleCount(),1);
              assert.match(await entries.filter({hasText:'P/E Ratio vs Earnings Yield'}).first().textContent(),/P\/E Ratio vs Earnings Yield/);
              await page.getByRole('button',{name:'Reset filters',exact:true}).click();
              assert.equal(await visibleCount(),11);

              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-innerWidth);
              assert(overflow<=1,`overflow ${overflow}px at ${width}`);
              const scan=await new AxeBuilder({page}).include('.intel-page-main').withTags(['wcag2a','wcag2aa','wcag21a','wcag21aa']).analyze();
              assert.equal(scan.violations.length,0,JSON.stringify(scan.violations));
              assert.deepEqual(errors,[]);

              const hrefs=[...new Set(await entries.locator('a[href]').evaluateAll(xs=>xs.map(x=>x.getAttribute('href')).filter(h=>h?.startsWith('/'))))];
              if(width===390){
                for(const href of hrefs){const r=await context.request.get('http://127.0.0.1:4173'+href);assert.equal(r.status(),200,href);}
              }
              if(width===390||width===1440){
                await page.screenshot({path:`.preview/intelligence-library/library-${width}.png`,fullPage:true});
                const issue=await context.newPage();
                await issue.goto('http://127.0.0.1:4173/intelligence/issues/',{waitUntil:'networkidle'});
                await issue.screenshot({path:`.preview/intelligence-library/magazine-${width}.png`,fullPage:true});
                await issue.close();
              }
              results.push({width,entries:11,overflow,axe:0});
              await context.close();
            }

            const nojs=await browser.newContext({javaScriptEnabled:false,viewport:{width:390,height:1000}});
            const noPage=await nojs.newPage();
            const noResp=await noPage.goto('http://127.0.0.1:4173/intelligence/library/');
            assert.equal(noResp.status(),200);
            assert.equal(await noPage.locator('[data-intel-entry]').count(),11);
            assert.equal(await noPage.locator('[data-intel-entry][hidden]').count(),0);
            assert.equal(await noPage.locator('[data-intel-library-tools]:visible').count(),0);
            assert.equal(await noPage.locator('[data-intel-kind-filters]:visible').count(),0);
            await nojs.close();

            writeFileSync('.preview/intelligence-library/results.json',JSON.stringify({status:'PASS',results,noJS:11},null,2));
            console.log('PASS: responsive library, search/type filters, no-JS fallback, links and accessibility.');
          }finally{await browser.close();}
          JS
          node .preview/intelligence-library/qa.mjs
      - name: Commit generated production output
        run: |
          git config user.name "MarketDeck Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public
          if ! git diff --cached --quiet; then
            git commit -m "Build unified Intelligence library output"
            git push origin HEAD:ia/intelligence-library-20260923
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intelligence-library-qa
          path: .preview/intelligence-library/
          retention-days: 7
          if-no-files-found: error
