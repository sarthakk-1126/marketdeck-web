name: Homepage overview live verification
on:
  push:
    branches: [ui/home-product-overview-20260923]
    paths: [.github/workflows/home-overview-live-qa.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7e800ffea1e9960926c2f08d5d4ea082ead900df
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact live release bytes
        run: |
          mkdir -p .preview/home-overview-live
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,hashlib,re,json
          report=[]
          beacon_sha='08315641718ee2685c70859826a5267fb4594fb81d5a9a8a4d1328b2f0fe631d'
          for path in ['index.html','home.css']:
              url='https://marketdeck.in/'+('' if path=='index.html' else path)
              expected=Path('public',path).read_bytes()
              req=urllib.request.Request(url,headers={'User-Agent':'MarketDeck-Release-Verification/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  data=r.read();status=r.status;final=r.url
              normalized=data;exception=None
              if path=='index.html' and data!=expected:
                  blocks=re.findall(rb'<script\b[^>]*src="https://static\.cloudflareinsights\.com/beacon\.min\.js/[^"<>]*"[^>]*></script>\n',data)
                  if len(blocks)==1 and hashlib.sha256(blocks[0]).hexdigest()==beacon_sha:
                      normalized=data.replace(blocks[0],b'',1)
                      exception='Single exact previously inspected Cloudflare analytics injection.'
              row={'path':path,'status':status,'finalURL':final,'actualSHA256':hashlib.sha256(data).hexdigest(),'reviewedSHA256':hashlib.sha256(expected).hexdigest(),'reviewedContentMatch':normalized==expected,'exception':exception}
              report.append(row)
              Path('.preview/home-overview-live/integrity.json').write_text(json.dumps(report,indent=2))
              assert status==200 and normalized==expected,row
          print('PASS: live homepage HTML and CSS match reviewed production release')
          PY
      - name: Install live browser QA tools
        run: |
          npm ci
          npm install --no-save --package-lock=false @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Verify live responsive product overview
        run: |
          cat > .preview/home-overview-live/live.mjs <<'JS'
          import {chromium} from '@playwright/test';
          import AxeBuilder from '@axe-core/playwright';
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          const widths=[320,390,768,1440,1920],results=[];
          const expected=[
            ['/screener/','StockProof'],
            ['/charts/','Charting'],
            ['/futures-and-options/','F&O'],
            ['/commentary/','Commentary'],
            ['/crypto/','Crypto World'],
          ];
          const browser=await chromium.launch();
          try{
            for(const width of widths){
              const context=await browser.newContext({viewport:{width,height:1000},reducedMotion:'reduce'});
              const page=await context.newPage();const errors=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              const response=await page.goto('https://marketdeck.in/',{waitUntil:'networkidle',timeout:60000});
              assert.equal(response.status(),200);
              const overview=page.locator('.suite-overview-section');
              assert.equal(await overview.count(),1);
              const cards=overview.locator('.suite-overview-card');
              assert.equal(await cards.count(),5);
              for(const [href,name] of expected){
                const card=overview.locator('.suite-overview-card',{has:page.getByRole('heading',{name,exact:true})});
                assert.equal(await card.count(),1,name);
                assert.equal(await card.locator(`a[href="${href}"]`).count(),1,href);
                assert(await card.isVisible(),name);
              }
              assert.equal(await page.locator('.product-panel').count(),5,'existing detailed showcase preserved');
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-innerWidth);
              assert(overflow<=1,`overflow ${overflow}px at ${width}`);
              const scan=await new AxeBuilder({page}).include('.suite-overview-section').withTags(['wcag2a','wcag2aa','wcag21a','wcag21aa']).analyze();
              assert.equal(scan.violations.length,0,JSON.stringify(scan.violations));
              assert.deepEqual(errors,[]);
              if(width===390||width===1440)await page.screenshot({path:`.preview/home-overview-live/live-${width}.png`,fullPage:true});
              results.push({width,cards:5,overflow,accessibilityViolations:0,consoleErrors:errors.length});
              await context.close();
            }
            writeFileSync('.preview/home-overview-live/results.json',JSON.stringify({status:'PASS',results},null,2));
            console.log('PASS: live overview verified at 320/390/768/1440/1920');
          }finally{await browser.close();}
          JS
          node .preview/home-overview-live/live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-overview-live-verification
          path: .preview/home-overview-live/
          retention-days: 7
          if-no-files-found: error
