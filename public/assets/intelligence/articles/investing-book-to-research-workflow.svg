<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">From an idea to a reviewable research note</title><desc id="d">An original conceptual workflow: state one question, gather dated evidence, then record a calculation and an alternative explanation. This is not an author’s complete method.</desc><rect width="960" height="480" rx="16" fill="#0d1722"/><path d="M32 88H928" stroke="#2b3d4e"/><text x="32" y="39" font-family="Arial,sans-serif" font-size="15" fill="#8fbce2">MARKETDECK / RESEARCH EXAMPLE</text><text x="32" y="72" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">From an idea to a reviewable research note</text><rect x="40" y="166" width="264" height="177" rx="8" fill="#163653"/><text x="58" y="205" font-family="Arial,sans-serif" font-size="17" fill="#9bc7ed">QUESTION</text><text x="58" y="252" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">One idea</text><text x="58" y="299" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">What could prove it wrong?</text><path d="M308 253 L340 253" fill="none" stroke="#456987" stroke-width="3"/><rect x="349" y="166" width="264" height="177" rx="8" fill="#163653"/><text x="367" y="205" font-family="Arial,sans-serif" font-size="17" fill="#9bc7ed">EVIDENCE</text><text x="367" y="252" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">Dated inputs</text><text x="367" y="299" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">Source, period and units</text><path d="M617 253 L649 253" fill="none" stroke="#456987" stroke-width="3"/><rect x="658" y="166" width="264" height="177" rx="8" fill="#163653"/><text x="676" y="205" font-family="Arial,sans-serif" font-size="17" fill="#9bc7ed">REVIEW</text><text x="676" y="252" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">Next observation</text><text x="676" y="299" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">Keep alternatives visible</text><text x="40" y="417" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">MarketDeck educational workflow · conceptual illustration · no performance claim</text></svg>