name: Prepare MarketDeck product artwork
on:
  push:
    branches: [assets/premium-product-art-20260923]
    paths: [.github/workflows/product-art-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image and browser tools
        run: |
          python -m pip install Pillow==12.3.0 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Recover images and prepare first crops
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen, Request
          from concurrent.futures import ThreadPoolExecutor
          import json, hashlib, io
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          root=Path('review'); (root/'originals').mkdir(parents=True,exist_ok=True)
          specs={
          'stockproof':('c9d94c93-2f99-432b-bed7-26c3a47de591','https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/c9d94c93-2f99-432b-bed7-26c3a47de591/7dd52817-c69e-4ffd-a3aa-1466430d3862/One_exquisite_standalone_editorial_product_card_artwork_for_.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTYzMGJmZGE4ODAyY2JiZiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDI5MjY5OH0.AISgVs0taK8V_G_oza5ipPZhAgmadoARR66RWkz350U'),
          'charting':('864e1da7-c63a-4d42-bc17-54ed72208c94','https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/864e1da7-c63a-4d42-bc17-54ed72208c94/209f935c-562a-41ec-b669-7d6312ef9b49/Create_ONE_new_standalone_premium_financial_editorial_artwor.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjFmYTUxMWM3MGY5ZWQyZiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDI4MDA5Mn0.nIQ0k7lg3LE452O049k649X10w1FtDtbGoDSIU-zfOA'),
          'fno':('0ea65eca-1047-404d-902d-f358ebf94c5b','https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/0ea65eca-1047-404d-902d-f358ebf94c5b/4760409c-2e01-44b5-95b7-e482849c11df/Create_ONE_new_standalone_financial_editorial_artwork__Match.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNGVjYzUyODNlNDdhOWIxYyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDMwMTMxNX0.vm1NJo_RaCd7lNillamviGZJLFcuxpHXmZrdJ49YRZc'),
          'commentary':('8071caaa-e62b-4fff-bd8a-b4a5226394ee','https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/8071caaa-e62b-4fff-bd8a-b4a5226394ee/7785c02c-4bc3-4de3-88a1-cb311a62ffaa/Create_ONE_new_standalone_premium_financial_editorial_artwor.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjAxZTU5ZTcwYjFkOThkMCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDI3NzYwN30.-Q0NSkEyMC3ssfYIT6jcfwRC9ChkYROZvjQnJFGhIxE'),
          'crypto':('684cb2ec-8a04-46c4-9713-83a6c1f3109c','https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/684cb2ec-8a04-46c4-9713-83a6c1f3109c/c4d09d66-b2a8-466e-80a3-929b08a302eb/Create_ONE_new_standalone_premium_financial_editorial_artwor.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZWU4ZGQ0NjI2OTdlYTRkYyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDI1OTU1NH0.Rxid8bzhDVKQVRYUanHR2hZWuDiz7OlmJkjHyDyRdzY')}
          dest=Path('public/assets/products/editorial-v2');dest.mkdir(parents=True,exist_ok=True)
          def prepare(item):
              name,(task,url)=item
              with urlopen(Request(url,headers={'User-Agent':'MarketDeck-Asset-Preparation/1.0'}),timeout=60) as r: raw=r.read(30000000)
              im=Image.open(io.BytesIO(raw));im.load();assert im.width>=1400 and im.height>=800
              (root/'originals'/f'{name}.png').write_bytes(raw)
              im=im.convert('RGB'); info={'taskId':task,'sourceSize':list(im.size),'sourceSHA256':hashlib.sha256(raw).hexdigest()}
              for suffix,size in [('',(1400,800)),('-small',(520,290))]:
                  img=ImageOps.fit(im,size,method=Image.Resampling.LANCZOS,centering=(.5,.5))
                  out=dest/f'{name}{suffix}.webp';img.save(out,quality=91,method=6)
                  info[suffix or 'large']={'size':list(size),'bytes':out.stat().st_size,'sha256':hashlib.sha256(out.read_bytes()).hexdigest()}
              return name,info
          report=dict(ThreadPoolExecutor(max_workers=5).map(prepare,specs.items()))
          (root/'assets.json').write_text(json.dumps(report,indent=2))
          p=Path('src/site-data.json');data=json.loads(p.read_text())
          for product in data['products']:
              name='fno' if product['id']=='fno' else product['id']
              product.update(preview=f'/assets/products/editorial-v2/{name}.webp',thumbnail=f'/assets/products/editorial-v2/{name}-small.webp',previewKind='Original editorial illustration')
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          sheet=Image.new('RGB',(1700,840),'#080c12');draw=ImageDraw.Draw(sheet)
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',21)
          labels=['StockProof','Charting','F&O','Commentary','Crypto World']
          for i,(name,label) in enumerate(zip(specs,labels)):
              x=40+i*550 if i<3 else 315+(i-3)*550;y=40 if i<3 else 440
              image=Image.open(dest/f'{name}.webp');image=ImageOps.fit(image,(520,298))
              sheet.paste(image,(x,y));draw.text((x+5,y+314),label,font=font,fill='#edf1f6')
          sheet.save(root/'contact-sheet.jpg',quality=94)
          print(json.dumps(report,indent=2))
          PY
          node scripts/build.mjs
          node scripts/build.mjs --review
          node --test tests/*.test.mjs
      - name: Capture actual homepage card crops
        run: |
          python -m http.server 4173 --directory public > /tmp/marketdeck-preview.log 2>&1 &
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json, time
          time.sleep(2)
          report=[]
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for width in [320,390,768,1024,1440,1920]:
                  page=browser.new_page(viewport={'width':width,'height':1000},device_scale_factor=1,reduced_motion='reduce')
                  errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
                  page.goto('http://127.0.0.1:4173/',wait_until='networkidle')
                  cards=page.locator('.product-tabs');cards.scroll_into_view_if_needed();page.wait_for_timeout(500)
                  assert page.locator('.product-tabs img').evaluate_all('(xs)=>xs.every(i=>i.complete && i.naturalWidth>0)')
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
                  assert not errors,errors
                  cards.screenshot(path=f'review/cards-{width}.png')
                  for i in range(5):
                      page.locator('.product-tab').nth(i).click();page.wait_for_timeout(150)
                      assert page.locator('.product-tab.is-active').count()==1
                  report.append({'width':width,'imagesLoaded':5,'overflow':False,'pageErrors':errors})
                  page.close()
              browser.close()
          Path('review/browser-qa.json').write_text(json.dumps(report,indent=2))
          PY
      - name: Bundle isolated source for visual review
        run: |
          mkdir -p review/site
          cp -r public src scripts tests content package.json package-lock.json playwright.config.mjs review/site/
      - uses: actions/upload-artifact@v4
        with:
          name: marketdeck-product-art-review
          path: review/
          retention-days: 3
          if-no-files-found: error
