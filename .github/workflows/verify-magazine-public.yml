name: Verify published magazine
on:
  push:
    branches: [editorial/interactive-magazine-v2-20260922]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check published PDF, cover and HTML over verified HTTPS
        shell: bash
        run: |
          set -euo pipefail
          base='https://marketdeck.in/intelligence/issues/agentic-trading-frontier-2026'
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 45 "$base/marketdeck-brief-v2.pdf" -o /tmp/magazine.pdf
          echo '8029bc7abb970df798ce177a39d796b84fb7bf259e973b0febda5c0127a09e83  /tmp/magazine.pdf' | sha256sum --check
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 45 "$base/cover-v2.webp" -o /tmp/cover.webp
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 45 "$base/" -o /tmp/issue.html
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 45 'https://marketdeck.in/intelligence/issues/' -o /tmp/archive.html
          python3 - <<'PY'
          from pathlib import Path
          pdf=Path('/tmp/magazine.pdf').read_bytes()
          assert pdf.startswith(b'%PDF-') and len(pdf)==67974
          assert b'/AcroForm' in pdf
          cover=Path('/tmp/cover.webp').read_bytes()
          assert cover[:4]==b'RIFF' and cover[8:12]==b'WEBP'
          issue=Path('/tmp/issue.html').read_text()
          archive=Path('/tmp/archive.html').read_text()
          assert 'marketdeck-brief-v2.pdf' in issue and '12 pages' in issue
          assert 'figure-06.webp' in issue and 'figure-09.webp' in issue
          assert 'marketdeck-brief-v2.pdf' in archive and 'cover-v2.webp' in archive
          print('PUBLIC SMOKE PASS: verified HTTPS; published PDF matches reviewed bytes; cover, 12-page HTML, figures and archive references are present.')
          PY
