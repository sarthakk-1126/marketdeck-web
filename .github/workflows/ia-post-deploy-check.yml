name: Verify IA closeout deployment receipt
on:
  push:
    branches: [feature/ia-hubs-deeplinks-20260923]
    paths: [.github/workflows/ia-post-deploy-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 25d130095fa02fcf2bfa7a999f7688c671bcb3b1
          persist-credentials: false
      - name: Verify final production commit and actual HTTPS
        run: |
          mkdir -p .preview/ia-receipt
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from datetime import datetime,timezone
          import urllib.request,hashlib,re,json,subprocess
          commit='25d130095fa02fcf2bfa7a999f7688c671bcb3b1'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==commit
          tree=subprocess.check_output(['git','rev-parse','HEAD:public'],text=True).strip()
          assert tree=='618ad976a2b829f0831c40c904ab9079c263185e'
          paths=['index.html','intelligence/index.html','intelligence/issues/index.html','sitemap.xml','intelligence-hub-v1.css','intelligence-article-v1.css','intelligence-shelf-v1.css','intelligence/issues/agentic-trading-frontier-2026/marketdeck-brief-v2.pdf','intelligence/issues/agentic-trading-frontier-2026/index.html']
          paths += ['intelligence/'+s+'/index.html' for s in ['equities','technical-analysis','futures-options']]
          paths += ['intelligence/notes/'+s+'/index.html' for s in ['pe-ratio-vs-earnings-yield','support-vs-resistance-stock-charts','call-option-vs-put-option-india']]
          paths += ['assets/intelligence/articles/'+s+'.svg' for s in ['pe-ratio-vs-earnings-yield','support-vs-resistance-stock-charts','call-option-vs-put-option-india']]
          report={'commit':commit,'publicTree':tree,'startedAt':datetime.now(timezone.utc).isoformat(),'publicChecks':[],'productChecks':[],'status':'RUNNING'}
          target=Path('.preview/ia-receipt/post-deploy-receipt.json')
          def save():target.write_text(json.dumps(report,indent=2))
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MarketDeck-Release-Verification/1.0'}),timeout=30) as r:return r.status,r.url,r.read()
          try:
              for path in paths:
                  url='https://marketdeck.in/'+(path[:-10] if path.endswith('index.html') else path)
                  status,final,data=get(url);expected=Path('public',path).read_bytes();normalized=data;exception=None
                  if data!=expected and path.endswith('.html'):
                      blocks=re.findall(rb'<script\b[^>]*src="https://static\.cloudflareinsights\.com/beacon\.min\.js/[^"<>]*"[^>]*></script>\n',data)
                      if len(blocks)==1 and hashlib.sha256(blocks[0]).hexdigest()=='08315641718ee2685c70859826a5267fb4594fb81d5a9a8a4d1328b2f0fe631d':
                          normalized=data.replace(blocks[0],b'',1);exception='Single exact previously inspected Cloudflare analytics injection; no provider settings changed.'
                  row={'url':url,'status':status,'finalURL':final,'rawSHA256':hashlib.sha256(data).hexdigest(),'reviewedSHA256':hashlib.sha256(expected).hexdigest(),'rawBytesMatch':data==expected,'reviewedContentMatch':normalized==expected,'comparisonException':exception}
                  report['publicChecks'].append(row);save();assert status==200 and final==url and normalized==expected,json.dumps(row)
                  print('PASS',url)
              class Links(HTMLParser):
                  def __init__(self):super().__init__();self.links=[];self.section=False
                  def handle_starttag(self,tag,attrs):
                      a=dict(attrs)
                      if tag=='a' and 'href' in a:self.links.append(a['href'])
                      if a.get('id')=='md-learning-links':self.section=True
              products=[('/screener/','equities','business-before-the-stock','pe-ratio-vs-earnings-yield'),('/charts/','technical-analysis','a-chart-is-a-question','support-vs-resistance-stock-charts'),('/futures-and-options/','futures-options','call-option-vs-put-option-india','iv-rank-vs-iv-percentile-nifty-options')]
              for path,hub,a,b in products:
                  url='https://marketdeck.in'+path;status,final,data=get(url);parser=Links();parser.feed(data.decode())
                  expected=['https://marketdeck.in/intelligence/'+hub+'/']+['https://marketdeck.in/intelligence/notes/'+x+'/' for x in [a,b]]
                  row={'url':url,'status':status,'finalURL':final,'learningSectionPresent':parser.section,'expectedLinks':expected,'allLinksPresent':all(x in parser.links for x in expected)}
                  report['productChecks'].append(row);save();assert status==200 and final==url and parser.section and row['allLinksPresent'],json.dumps(row);print('PASS',url)
              report['status']='PASS';report['finishedAt']=datetime.now(timezone.utc).isoformat();save();print('PASS: 18 exact public checks plus 3 product education-link receipts after deployment; public tree unchanged.')
          except Exception as e:report['status']='FAIL';report['error']=str(e);save();raise
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketdeck-ia-post-deploy-receipt
          path: .preview/ia-receipt/
          retention-days: 7
          if-no-files-found: error
