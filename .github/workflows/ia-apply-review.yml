name: Complete and verify Intelligence IA
on:
  push:
    branches: [feature/ia-hubs-deeplinks-20260923]
    paths: [.github/workflows/ia-apply-review.yml]
permissions:
  contents: write
concurrency:
  group: marketdeck-ia-final-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resume existing implementation and verify repair integrity
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = a3a9f30dbec2d37ae3906fd169e5184e41533d31
          cat .ia/mdpart-* | base64 -d | gunzip > /tmp/ia.patch
          git apply --check /tmp/ia.patch
          git apply --whitespace=fix /tmp/ia.patch
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib
          encoded=Path('.github/ia-final-repair.b64').read_text().replace('WRcWRc','WRc').replace('qcKgKg','qcKg')
          data=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(data).hexdigest()=='93e6f55f26c86dcca193fa3cb10eb445faca76be83651f0ad66202b1ef8b0004','Repair transport integrity failed'
          Path('/tmp/ia-repair.py').write_bytes(data)
          PY
          python3 /tmp/ia-repair.py
      - name: Build and test current repository
        run: |
          set -euo pipefail
          mkdir -p .preview/ia-final
          npm ci
          npm run build
          npm run build:review
          node --check scripts/articles.mjs
          node --check scripts/intelligence.mjs
          node --test --test-concurrency=1 tests/*.test.mjs | tee .preview/ia-final/unit-tests.txt
          python3 scripts/check-ia-preservation.py | tee .preview/ia-final/preservation.json
          git diff --check
      - name: Install QA-only tools
        run: |
          npm install --no-save --package-lock=false @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Responsive, accessible, no-JavaScript and deep-link checks
        run: |
          set -euo pipefail
          python3 -m http.server 4173 -d public >/tmp/ia-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node scripts/qa-ia-release.mjs
      - name: Clean temporary tooling and commit tested implementation to feature branch only
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = a3a9f30dbec2d37ae3906fd169e5184e41533d31
          rm -rf .ia
          rm -f .github/ia-payload.* .github/ia-final-repair.b64
          rm -f .github/workflows/ia-source-review.yml .github/workflows/ia-apply-review.yml .github/workflows/ia-resume-snapshot.yml
          git add -A -- .ia .github content public scripts tests docs
          git diff --cached --check
          git config user.name 'MarketDeck IA release'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Complete learning hubs, reciprocal deep links and three foundational guides'
          git push origin HEAD:feature/ia-hubs-deeplinks-20260923
          git rev-parse HEAD > .preview/ia-final/reviewed-head.txt
          git diff --stat origin/main HEAD > .preview/ia-final/diff-stat.txt
          git archive HEAD > .preview/ia-final/reviewed-source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketdeck-ia-final-review
          path: .preview/ia-final/
          retention-days: 7
          if-no-files-found: warn
