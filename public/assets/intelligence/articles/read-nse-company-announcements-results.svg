<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">Three clocks. One information boundary.</title><desc id="d">This hypothetical timeline separates the financial period ending 31 March, publication on 24 April, and retrieval on 5 June. A decision before publication cannot use the later document.</desc><rect width="960" height="480" rx="16" fill="#0d1722"/><path d="M32 88H928" stroke="#2b3d4e"/><text x="32" y="39" font-family="Arial,sans-serif" font-size="15" fill="#8fbce2">MARKETDECK / RESEARCH EXAMPLE</text><text x="32" y="72" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">Three clocks. One information boundary.</text><rect x="40" y="170" width="264" height="165" rx="8" fill="#163653"/><text x="60" y="204" font-family="Arial,sans-serif" font-size="17" fill="#9bc7ed">PERIOD ENDS</text><text x="60" y="252" font-family="Arial,sans-serif" font-size="32" fill="#edf1f6">31 March</text><text x="60" y="300" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">What the figures describe</text><path d="M307 250 L343 250" fill="none" stroke="#456987" stroke-width="3"/><rect x="349" y="170" width="264" height="165" rx="8" fill="#163653"/><text x="369" y="204" font-family="Arial,sans-serif" font-size="17" fill="#9bc7ed">PUBLISHED</text><text x="369" y="252" font-family="Arial,sans-serif" font-size="32" fill="#edf1f6">24 April</text><text x="369" y="300" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">When the evidence arrives</text><path d="M616 250 L652 250" fill="none" stroke="#456987" stroke-width="3"/><rect x="658" y="170" width="264" height="165" rx="8" fill="#163653"/><text x="678" y="204" font-family="Arial,sans-serif" font-size="17" fill="#9bc7ed">RETRIEVED</text><text x="678" y="252" font-family="Arial,sans-serif" font-size="32" fill="#edf1f6">5 June</text><text x="678" y="300" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">Which version you saved</text><text x="40" y="408" font-family="Arial,sans-serif" font-size="18" fill="#c8d6e5">Illustrative dates · never substitute the period-end date for publication time</text></svg>