<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">From a rule to an inspectable experiment</title><desc id="d">An original conceptual workflow: define rules and data, inspect a signal and possible fill, then compare costs and recorded attempts. No market data or returns are depicted.</desc><rect width="960" height="480" rx="16" fill="#0d1722"/><path d="M32 88H928" stroke="#2b3d4e"/><text x="32" y="39" font-family="Arial,sans-serif" font-size="15" fill="#8fbce2">MARKETDECK / RESEARCH EXAMPLE</text><text x="32" y="72" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">From a rule to an inspectable experiment</text><rect x="40" y="166" width="264" height="177" rx="8" fill="#163653"/><text x="58" y="205" font-family="Arial,sans-serif" font-size="17" fill="#9bc7ed">SPECIFY</text><text x="58" y="252" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">Rules + data</text><text x="58" y="299" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">State timing and costs</text><path d="M308 253 L340 253" fill="none" stroke="#456987" stroke-width="3"/><rect x="349" y="166" width="264" height="177" rx="8" fill="#163653"/><text x="367" y="205" font-family="Arial,sans-serif" font-size="17" fill="#9bc7ed">INSPECT</text><text x="367" y="252" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">Signal to fill</text><text x="367" y="299" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">Trace an event by hand</text><path d="M617 253 L649 253" fill="none" stroke="#456987" stroke-width="3"/><rect x="658" y="166" width="264" height="177" rx="8" fill="#163653"/><text x="676" y="205" font-family="Arial,sans-serif" font-size="17" fill="#9bc7ed">COMPARE</text><text x="676" y="252" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">All attempts</text><text x="676" y="299" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">Keep selection visible</text><text x="40" y="417" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">MarketDeck educational workflow · conceptual illustration · no performance claim</text></svg>