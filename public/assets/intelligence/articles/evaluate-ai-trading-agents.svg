<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">A result has four layers to verify</title><desc id="d">Proposed assessment framework: evidence checks sources and time; analysis checks units and calculations; decision checks rules and limits; operations checks authoritative state and retries. Each layer can fail independently.</desc><rect width="960" height="480" rx="16" fill="#0d1722"/><path d="M32 88H928" stroke="#2b3d4e"/><text x="32" y="39" font-family="Arial,sans-serif" font-size="15" fill="#8fbce2">MARKETDECK / RESEARCH EXAMPLE</text><text x="32" y="72" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">A result has four layers to verify</text><rect x="30" y="155" width="215" height="210" rx="8" fill="#163653"/><text x="44" y="192" font-family="Arial,sans-serif" font-size="17" fill="#9bc7ed">01 / EVIDENCE</text><text x="44" y="249" font-family="Arial,sans-serif" font-size="21" fill="#edf1f6">Source &amp; time</text><text x="44" y="325" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">Late document</text><rect x="267" y="155" width="215" height="210" rx="8" fill="#163653"/><text x="281" y="192" font-family="Arial,sans-serif" font-size="17" fill="#9bc7ed">02 / ANALYSIS</text><text x="281" y="249" font-family="Arial,sans-serif" font-size="21" fill="#edf1f6">Units &amp; maths</text><text x="281" y="325" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">Wrong denominator</text><rect x="504" y="155" width="215" height="210" rx="8" fill="#163653"/><text x="518" y="192" font-family="Arial,sans-serif" font-size="17" fill="#9bc7ed">03 / DECISION</text><text x="518" y="249" font-family="Arial,sans-serif" font-size="21" fill="#edf1f6">Rules &amp; limits</text><text x="518" y="325" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">Exposure breach</text><rect x="741" y="155" width="215" height="210" rx="8" fill="#163653"/><text x="755" y="192" font-family="Arial,sans-serif" font-size="17" fill="#9bc7ed">04 / OPERATIONS</text><text x="755" y="249" font-family="Arial,sans-serif" font-size="21" fill="#edf1f6">State &amp; retries</text><text x="755" y="325" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">Duplicate action</text><text x="32" y="428" font-family="Arial,sans-serif" font-size="18" fill="#c8d6e5">Conceptual evaluation framework · not benchmark results or a trading system</text></svg>