<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">The return depends on the denominator</title><desc id="d">Hypothetical prices: 100, 120, 90 and 135. The peak-to-trough drawdown is 25%; recovering from 90 to the previous peak of 120 requires 33.3%.</desc><rect width="960" height="480" rx="16" fill="#0d1722"/><path d="M32 88H928" stroke="#2b3d4e"/><text x="32" y="39" font-family="Arial,sans-serif" font-size="15" fill="#8fbce2">MARKETDECK / RESEARCH EXAMPLE</text><text x="32" y="72" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">The return depends on the denominator</text><path d="M74 352 L878 352" fill="none" stroke="#456987" stroke-width="3"/><path d="M100 250 L340 170 L580 290 L820 110" stroke="#72b9f9" stroke-width="5" fill="none"/><circle cx="100" cy="250" r="8" fill="#b5dcff"/><text x="78" y="228" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">100</text><text x="91" y="386" font-family="Arial,sans-serif" font-size="20" fill="#c8d6e5">A</text><circle cx="340" cy="170" r="8" fill="#b5dcff"/><text x="318" y="148" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">120</text><text x="331" y="386" font-family="Arial,sans-serif" font-size="20" fill="#c8d6e5">B</text><circle cx="580" cy="290" r="8" fill="#b5dcff"/><text x="558" y="268" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">90</text><text x="571" y="386" font-family="Arial,sans-serif" font-size="20" fill="#c8d6e5">C</text><circle cx="820" cy="110" r="8" fill="#b5dcff"/><text x="798" y="88" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">135</text><text x="811" y="386" font-family="Arial,sans-serif" font-size="20" fill="#c8d6e5">D</text><text x="342" y="264" font-family="Arial,sans-serif" font-size="30" fill="#c8d6e5">−25%</text><text x="628" y="230" font-family="Arial,sans-serif" font-size="30" fill="#c8d6e5">+50%</text><text x="75" y="427" font-family="Arial,sans-serif" font-size="18" fill="#c8d6e5">Return from 90 to the previous 120 peak: +33.3% · no market data used</text></svg>