<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">Same current IV. Different historical extremes.</title><desc id="d">With the historical outlier, rank is 14.3 and percentile is 85. Replacing the outlier makes rank 71.4 while percentile stays 85. Current IV is 20%; the sample contains 20 hypothetical prior observations and counts values strictly below current IV.</desc><rect width="960" height="480" rx="16" fill="#0d1722"/><path d="M32 88H928" stroke="#2b3d4e"/><text x="32" y="39" font-family="Arial,sans-serif" font-size="15" fill="#8fbce2">MARKETDECK / RESEARCH EXAMPLE</text><text x="32" y="72" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">Same current IV. Different historical extremes.</text><text x="42" y="161" font-family="Arial,sans-serif" font-size="20" fill="#c8d6e5">Outlier: rank</text><rect x="284" y="135" width="78.571427" height="36" rx="8" fill="#7ac1fc"/><text x="380.57142699999997" y="162" font-family="Arial,sans-serif" font-size="24" fill="#edf1f6">14.3</text><text x="42" y="227" font-family="Arial,sans-serif" font-size="20" fill="#c8d6e5">Outlier: percentile</text><rect x="284" y="201" width="467.5" height="36" rx="8" fill="#376480"/><text x="769.5" y="228" font-family="Arial,sans-serif" font-size="24" fill="#edf1f6">85</text><text x="42" y="293" font-family="Arial,sans-serif" font-size="20" fill="#c8d6e5">No outlier: rank</text><rect x="284" y="267" width="392.8571405" height="36" rx="8" fill="#7ac1fc"/><text x="694.8571405" y="294" font-family="Arial,sans-serif" font-size="24" fill="#edf1f6">71.4</text><text x="42" y="359" font-family="Arial,sans-serif" font-size="20" fill="#c8d6e5">No outlier: percentile</text><rect x="284" y="333" width="467.5" height="36" rx="8" fill="#376480"/><text x="769.5" y="360" font-family="Arial,sans-serif" font-size="24" fill="#edf1f6">85</text><text x="42" y="433" font-family="Arial,sans-serif" font-size="18" fill="#c8d6e5">Relative statistics, not profit probabilities · 20 synthetic observations</text></svg>