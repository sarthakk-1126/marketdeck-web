name: Verify and stage MarketDeck product art
on:
  push:
    branches: [assets/premium-product-art-20260923]
    paths: [.github/workflows/product-art-verify.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: marketdeck-product-art-final
          run-id: 35817414195
          github-token: ${{ github.token }}
          path: /tmp/art-final
      - name: Install image and browser tools
        run: |
          python -m pip install Pillow==12.3.0 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Restore only reviewed artwork changes and finalize exports
        run: |
          python - <<'PY'
          import shutil,json
          from pathlib import Path
          source=Path('/tmp/art-final/site')
          for name in ['src/site-data.json','scripts/build.mjs','scripts/editorial.mjs','public/home.css','public/index.html','public/credits/index.html']:
              shutil.copy2(source/name,name)
          p=Path('scripts/prepare-product-art-v2.py');s=p.read_text()
          old="full=ImageOps.fit(image,(1400,800),Image.Resampling.LANCZOS) if image.width/image.height<2 else stage(image,(1400,800),.94)"
          new="full=ImageOps.fit(image,(1400,800),Image.Resampling.LANCZOS)"
          assert old in s or new in s;p.write_text(s.replace(old,new))
          PY
          python scripts/prepare-product-art-v2.py /tmp/art-final/originals
          python - <<'PY'
          from pathlib import Path
          import json
          m=json.loads(Path('public/assets/products/editorial-v2/asset-manifest.json').read_text())
          lines=['# MarketDeck product artwork V2','', 'Owner-authorized publication: 23 September 2026.','', '## Scope','Five original AI-assisted conceptual illustrations: business foundations, price structure, derivatives geometry, source-linked commentary and digital infrastructure. Not real application screenshots or market data.','', '## Delivery','1400 x 800 previews, 520 x 290 thumbnails and 1040 x 580 high-density thumbnails. Versioned self-hosted WebP paths with exact SHA-256 hashes and dimensions in asset-manifest.json.','Export total: '+str(m['totalBytes'])+' bytes across 15 files.','Thumbnails preserve unwarped subjects in a central safe band with edge-tone extensions. Only the object-position CSS property changes; card sizes and motion are unchanged. FNO preview uses a seamless full-frame crop. Old files remain for rollback.','', '## Reproduction','Run python scripts/prepare-product-art-v2.py ORIGINAL_DIRECTORY with Pillow 12.3.0, then node scripts/build.mjs and node scripts/build.mjs --review.','Original PNGs remain in the review artifacts and connected image workspace; generation task IDs and source hashes are recorded without signed URLs.','', '## Verification','Fifteen Node contracts plus browser image loading, mobile/desktop overflow and product selection checks. Normal-motion cards are focused and fully docked before click targeting. Globe, product event code, magazine and deployment configuration are protected from change. See the release PR and workflow logs for final results.']
          Path('docs/PRODUCT_ART_V2.md').write_text('\n'.join(lines)+'\n')
          PY
          node scripts/build.mjs
          node scripts/build.mjs --review
          node --check scripts/build.mjs
          node --check scripts/editorial.mjs
          node --test tests/*.test.mjs
      - name: Verify exact preservation scope
        run: |
          python - <<'PY'
          import subprocess,json,hashlib
          from pathlib import Path
          original=subprocess.check_output(['git','show','HEAD:public/index.html'],text=True)
          old=json.loads(subprocess.check_output(['git','show','HEAD:src/site-data.json'],text=True));new=json.loads(Path('src/site-data.json').read_text())
          for a,b in zip(old['products'],new['products']):
              assert {k:v for k,v in a.items() if k not in ('preview','thumbnail','previewKind')}=={k:v for k,v in b.items() if k not in ('preview','thumbnail','thumbnail2x','previewKind')}
              original=original.replace(a['thumbnail'],b['thumbnail']).replace(a['preview'],b['preview']).replace(a['previewKind'],b['previewKind'])
              original=original.replace('src="'+b['thumbnail']+'" width="520"','src="'+b['thumbnail']+'" srcset="'+b['thumbnail']+' 1x, '+b['thumbnail2x']+' 2x" width="520"')
          assert original.strip()==Path('public/index.html').read_text().strip()
          assert {k:v for k,v in old.items() if k!='products'}=={k:v for k,v in new.items() if k!='products'}
          protected=['public/home.js','public/experience.js','public/assets/globe.js','src/globe.js','src/earth-shaders.js','src/index.template.html','public/intelligence','content/briefs.json','.github/workflows/deploy.yml']
          assert not subprocess.check_output(['git','diff','--name-only','--',*protected],text=True).strip()
          print('Scope and preservation PASS')
          PY
      - name: Browser image and interaction review
        run: |
          mkdir -p review-verified
          python -m http.server 4173 --directory public >/tmp/art-server.log 2>&1 &
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright,expect
          from PIL import Image,ImageDraw,ImageFont,ImageOps
          import json,time,re,shutil
          out=Path('review-verified');report=[];time.sleep(2)
          with sync_playwright() as p:
              browser=p.chromium.launch(args=['--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              for width,height,motion in [(320,800,'reduce'),(390,844,'reduce'),(768,1024,'reduce'),(1024,900,'reduce'),(1440,1000,'reduce'),(1920,1080,'reduce'),(1280,720,'no-preference'),(1440,900,'no-preference')]:
                  page=browser.new_page(viewport={'width':width,'height':height},device_scale_factor=2,reduced_motion=motion)
                  errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
                  page.goto('http://127.0.0.1:4173/#products',wait_until='networkidle');page.wait_for_timeout(1200)
                  page.locator('.product-tab').first.focus();page.wait_for_timeout(600)
                  if motion=='no-preference':page.wait_for_function('!document.querySelector(".story-gallery").inert')
                  page.locator('.story-gallery').screenshot(path=str(out/f'cards-{width}-{height}-{motion}.png'))
                  assert page.locator('.product-tabs img').evaluate_all('(xs)=>xs.length===5&&xs.every(i=>i.complete&&i.naturalWidth>0&&i.currentSrc.includes("@2x"))')
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
                  for i in range(5):
                      tab=page.locator('.product-tab').nth(i)
                      tab.focus();page.wait_for_timeout(450)
                      if motion=='no-preference':page.wait_for_function('!document.querySelector(".story-gallery").inert')
                      tab.click(timeout=15000)
                      expect(tab).to_have_attribute('aria-selected','true',timeout=5000)
                      panel=page.locator('#'+tab.get_attribute('aria-controls'));expect(panel).to_be_visible(timeout=5000)
                      assert page.locator('.product-tab.is-active').count()==1
                  assert not errors,errors
                  report.append({'width':width,'height':height,'motion':motion,'density':2,'imagesLoaded':5,'nativeClickSelections':5,'overflow':False,'pageErrors':errors})
                  (out/'browser-qa.json').write_text(json.dumps(report,indent=2));page.close()
              browser.close()
          print(json.dumps(report,indent=2))
          sheet=Image.new('RGB',(1740,1000),'#080c12');d=ImageDraw.Draw(sheet)
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',23)
          small=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',15)
          d.text((42,26),'MARKETDECK / PRODUCT ARTWORK',font=font,fill='#edf1f6');d.text((42,64),'Graphite. Optical glass. Research made visible.',font=small,fill='#929eac')
          for i,(name,label) in enumerate(zip(['stockproof','charting','fno','commentary','crypto'],['StockProof','Charting','F&O','Commentary','Crypto World'])):
              x=42+i*560 if i<3 else 322+(i-3)*560;y=120 if i<3 else 560
              img=ImageOps.fit(Image.open(f'public/assets/products/editorial-v2/{name}.webp'),(536,306))
              sheet.paste(img,(x,y));d.text((x+4,y+322),label,font=font,fill='#edf1f6')
          sheet.save(out/'MarketDeck_Product_Artwork.jpg',quality=95)
          shutil.copytree('public/assets/products/editorial-v2',out/'editorial-v2')
          PY
      - name: Commit verified scoped changes to release branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/products/editorial-v2 src/site-data.json scripts/build.mjs scripts/editorial.mjs scripts/prepare-product-art-v2.py public/home.css public/index.html public/credits/index.html docs/PRODUCT_ART_V2.md
          git diff --cached --check
          git commit -m 'Replace product cards with verified premium editorial artwork'
          git push origin HEAD:assets/premium-product-art-20260923
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketdeck-product-art-verified
          path: review-verified/
          retention-days: 3
          if-no-files-found: error
