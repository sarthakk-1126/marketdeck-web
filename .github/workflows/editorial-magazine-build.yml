name: Build interactive magazine review assets

on:
  push:
    branches:
      - editorial/interactive-magazine-v2-20260922
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-magazine-v2-review
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/editorial/interactive-magazine-v2-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/interactive-magazine-v2-20260922
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned editorial dependencies
        run: python -m pip install reportlab==4.4.9 PyMuPDF==1.26.7 Pillow==12.3.0
      - name: Generate PDF, cover, figures and public HTML
        run: python scripts/prepare-agentic-magazine.py
      - name: Validate JavaScript and publication contracts
        run: |
          node --check scripts/editorial.mjs
          node --check scripts/build.mjs
          node --test tests/*.test.mjs
      - name: Check document interactions and preserve homepage outside the magazine
        run: |
          python - <<'PY'
          import hashlib, json, re, subprocess
          from pathlib import Path
          import fitz
          path=Path('content/issues/agentic-trading-frontier-2026/marketdeck-brief-v2.pdf')
          pdf=fitz.open(path)
          assert len(pdf)==12
          assert len(pdf.get_toc())==12
          assert sum(len(p.get_links()) for p in pdf)==88
          assert sum(len(list(p.widgets() or [])) for p in pdf)==11
          for page in pdf:
              for widget in page.widgets() or []:
                  if widget.field_name=='question':
                      widget.field_value='A saved research question, not an order.'
                      widget.update()
                  if widget.field_name=='check_1':
                      widget.field_value=widget.on_state()
                      widget.update()
          out=Path('.preview/magazine-v2'); out.mkdir(parents=True,exist_ok=True)
          pdf.save(out/'roundtrip.pdf')
          check=fitz.open(out/'roundtrip.pdf')
          fields={w.field_name:w.field_value for p in check for w in p.widgets() or []}
          assert fields['question']=='A saved research question, not an order.'
          assert fields['check_1'] not in (False,'Off','',None)
          check.close(); pdf.close()
          original=subprocess.check_output(['git','show','HEAD:public/index.html'],text=True)
          revised=Path('public/index.html').read_text()
          strip=lambda s:re.sub(r'<section class="brief-section"[\s\S]*?</section>','MAGAZINE',s).strip()
          assert strip(original)==strip(revised),'Homepage changed outside magazine section'
          protected=['public/home.css','public/home.js','public/experience.js','public/assets/globe.js','src/globe.js','src/earth-shaders.js','src/index.template.html','src/site-data.json']
          assert not subprocess.check_output(['git','diff','--name-only','--',*protected],text=True).strip()
          doc=fitz.open(path)
          for n,p in enumerate(doc): p.get_pixmap(matrix=fitz.Matrix(1.3,1.3),alpha=False).save(out/f'page-{n+1:02d}.png')
          print('PDF_SHA256='+hashlib.sha256(path.read_bytes()).hexdigest())
          print(Path('content/issues/agentic-trading-frontier-2026/pdf-qa.json').read_text())
          PY
      - name: Commit only approved magazine outputs to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/briefs.json content/issues/agentic-trading-frontier-v2.json content/issues/agentic-trading-frontier-2026 public/index.html public/intelligence public/sitemap.xml scripts/editorial.mjs scripts/generate-brief.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Generate verified 12-page interactive magazine and web edition'
            git push origin HEAD:editorial/interactive-magazine-v2-20260922
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: marketdeck-magazine-v2-review
          include-hidden-files: true
          path: |
            content/issues/agentic-trading-frontier-2026/marketdeck-brief-v2.pdf
            content/issues/agentic-trading-frontier-2026/cover-v2.webp
            content/issues/agentic-trading-frontier-2026/pdf-qa.json
            .preview/magazine-v2/page-*.png
          retention-days: 7
