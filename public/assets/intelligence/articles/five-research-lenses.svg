<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">Five lenses are not five independent votes</title><desc id="d">This proposed framework connects business, valuation, price, conversation and risk to one source-linked memo, while preserving conflicting evidence.</desc><rect width="960" height="480" rx="16" fill="#0d1722"/><path d="M32 88H928" stroke="#2b3d4e"/><text x="32" y="39" font-family="Arial,sans-serif" font-size="15" fill="#8fbce2">MARKETDECK / RESEARCH EXAMPLE</text><text x="32" y="72" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">Five lenses are not five independent votes</text><rect x="30" y="145" width="168" height="74" rx="8" fill="#163653"/><text x="46" y="191" font-family="Arial,sans-serif" font-size="22" fill="#c8d6e5">Business</text><path d="M114 219 L480 300" fill="none" stroke="#456987" stroke-width="3"/><rect x="218" y="145" width="168" height="74" rx="8" fill="#163653"/><text x="234" y="191" font-family="Arial,sans-serif" font-size="22" fill="#c8d6e5">Valuation</text><path d="M302 219 L480 300" fill="none" stroke="#456987" stroke-width="3"/><rect x="406" y="145" width="168" height="74" rx="8" fill="#163653"/><text x="422" y="191" font-family="Arial,sans-serif" font-size="22" fill="#c8d6e5">Price</text><path d="M490 219 L480 300" fill="none" stroke="#456987" stroke-width="3"/><rect x="594" y="145" width="168" height="74" rx="8" fill="#163653"/><text x="610" y="191" font-family="Arial,sans-serif" font-size="22" fill="#c8d6e5">Conversation</text><path d="M678 219 L480 300" fill="none" stroke="#456987" stroke-width="3"/><rect x="782" y="145" width="168" height="74" rx="8" fill="#163653"/><text x="798" y="191" font-family="Arial,sans-serif" font-size="22" fill="#c8d6e5">Risk</text><path d="M866 219 L480 300" fill="none" stroke="#456987" stroke-width="3"/><rect x="259" y="300" width="442" height="80" rx="8" fill="#295575"/><text x="310" y="350" font-family="Arial,sans-serif" font-size="28" fill="#edf1f6">One source-linked memo</text><text x="40" y="432" font-family="Arial,sans-serif" font-size="18" fill="#c8d6e5">Conceptual workflow · preserve disagreement, assumptions and uncertainty</text></svg>