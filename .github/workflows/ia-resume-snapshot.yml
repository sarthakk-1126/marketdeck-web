name: Resume IA source
on:
  push:
    branches: [feature/ia-hubs-deeplinks-20260923]
    paths: [.github/workflows/ia-resume-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/ia-resume
          git archive HEAD > /tmp/ia-resume/source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: ia-resume-source
          path: /tmp/ia-resume/
          retention-days: 3
