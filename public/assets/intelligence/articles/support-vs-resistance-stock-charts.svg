<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">Support and resistance are zones, not walls</title><desc id="d">Hypothetical price path approaches a support zone near 500 and a resistance zone near 620 several times before breaking above resistance. The graphic is conceptual and not market data.</desc><rect width="960" height="480" rx="16" fill="#0d1722"/><path d="M32 88H928" stroke="#2b3d4e"/><text x="32" y="39" font-family="Arial,sans-serif" font-size="15" fill="#8fbce2">MARKETDECK / RESEARCH EXAMPLE</text><text x="32" y="72" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">Support and resistance are zones, not walls</text><rect x="55" y="300" width="850" height="48" rx="8" fill="#173653" opacity=".85"/><text x="70" y="331" font-family="Arial,sans-serif" font-size="18" fill="#9bc7ed">SUPPORT ZONE ~ ₹500</text><rect x="55" y="128" width="850" height="48" rx="8" fill="#432f3d" opacity=".85"/><text x="70" y="159" font-family="Arial,sans-serif" font-size="18" fill="#f3b7ca">RESISTANCE ZONE ~ ₹620</text><path d="M70 270 L170 180 L270 320 L370 155 L470 305 L570 145 L670 270 L760 125 L875 88" stroke="#72b9f9" stroke-width="5" fill="none"/><circle cx="70" cy="270" r="6" fill="#d9edff"/><circle cx="170" cy="180" r="6" fill="#d9edff"/><circle cx="270" cy="320" r="6" fill="#d9edff"/><circle cx="370" cy="155" r="6" fill="#d9edff"/><circle cx="470" cy="305" r="6" fill="#d9edff"/><circle cx="570" cy="145" r="6" fill="#d9edff"/><circle cx="670" cy="270" r="6" fill="#d9edff"/><circle cx="760" cy="125" r="6" fill="#d9edff"/><circle cx="875" cy="88" r="6" fill="#d9edff"/><text x="55" y="425" font-family="Arial,sans-serif" font-size="18" fill="#c8d6e5">Hypothetical path · repeated reactions create context, not certainty</text></svg>