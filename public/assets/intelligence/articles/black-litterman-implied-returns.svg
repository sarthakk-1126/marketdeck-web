<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">Prior → views → posterior returns</title><desc id="d">Conceptual Black-Litterman flow from reverse-implied prior returns through reader-stated views and confidence to posterior expected returns, with an explicit stop before allocation weights. No portfolio data is shown.</desc><rect width="960" height="480" rx="16" fill="#0d1722"/><path d="M32 88H928" stroke="#2b3d4e"/><text x="32" y="39" font-family="Arial,sans-serif" font-size="15" fill="#8fbce2">MARKETDECK / RESEARCH EXAMPLE</text><text x="32" y="72" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">Prior → views → posterior returns</text><rect x="46" y="164" width="240" height="126" rx="8" fill="#163653"/><text x="64" y="200" font-family="Arial,sans-serif" font-size="15" fill="#9bc7ed">PRIOR</text><text x="64" y="248" font-family="Arial,sans-serif" font-size="28" fill="#edf1f6">Π = δΣw</text><rect x="360" y="164" width="240" height="126" rx="8" fill="#163653"/><text x="378" y="200" font-family="Arial,sans-serif" font-size="15" fill="#9bc7ed">VIEWS</text><text x="378" y="248" font-family="Arial,sans-serif" font-size="28" fill="#edf1f6">P · Q · Ω</text><rect x="674" y="164" width="240" height="126" rx="8" fill="#254e70"/><text x="692" y="200" font-family="Arial,sans-serif" font-size="15" fill="#9bc7ed">POSTERIOR</text><text x="692" y="248" font-family="Arial,sans-serif" font-size="28" fill="#edf1f6">μ_BL</text><path d="M286 227 L360 227" fill="none" stroke="#72b9f9" stroke-width="3"/><path d="M600 227 L674 227" fill="none" stroke="#72b9f9" stroke-width="3"/><rect x="298" y="342" width="364" height="66" rx="8" fill="#2e1f2b" stroke="#6b4458"/><text x="334" y="382" font-family="Arial,sans-serif" font-size="18" fill="#f3b7ca">STOP BEFORE TARGET WEIGHTS</text><text x="249" y="447" font-family="Arial,sans-serif" font-size="17" fill="#c8d6e5">Return implications only · no allocation, tilt or recommended mix</text></svg>