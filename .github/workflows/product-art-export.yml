name: Final seamless product artwork exports
on:
  push:
    branches: [assets/premium-product-art-20260923]
    paths: [.github/workflows/product-art-export.yml]
permissions:
  contents: write
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: marketdeck-product-art-final
          run-id: 35817414195
          github-token: ${{ github.token }}
          path: /tmp/art-final
      - name: Export and check all assets
        run: |
          python -m pip install Pillow==12.3.0 playwright==1.56.0
          python scripts/prepare-product-art-v2.py /tmp/art-final/originals
          node scripts/build.mjs --review
          node --test tests/*.test.mjs
          python - <<'PY'
          import json,re
          from pathlib import Path
          m=json.loads(Path('public/assets/products/editorial-v2/asset-manifest.json').read_text())
          p=Path('docs/PRODUCT_ART_V2.md');p.write_text(re.sub(r'Export total: \d+ bytes',f"Export total: {m['totalBytes']} bytes",p.read_text()))
          PY
      - name: Final card screenshots and native navigation checks
        run: |
          mkdir -p release-review
          python -m http.server 4173 --directory public >/tmp/art-server.log 2>&1 &
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright,expect
          from PIL import Image,ImageDraw,ImageFont,ImageOps
          import json,time,shutil
          time.sleep(2);out=Path('release-review');results=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(channel='chrome',args=['--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              for width,height,motion in [(320,800,'reduce'),(390,844,'reduce'),(768,1024,'reduce'),(1024,900,'reduce'),(1440,1000,'reduce'),(1920,1080,'reduce'),(1280,720,'no-preference'),(1440,900,'no-preference')]:
                  page=browser.new_page(viewport={'width':width,'height':height},device_scale_factor=2,reduced_motion=motion)
                  errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
                  page.goto('http://127.0.0.1:4173/#products',wait_until='networkidle');page.wait_for_timeout(1000)
                  if motion=='no-preference':
                      page.locator('.nav-cta').click();page.wait_for_function('!document.querySelector(".story-gallery").inert',timeout=5000)
                  else: page.locator('.product-tabs').scroll_into_view_if_needed()
                  page.wait_for_timeout(300)
                  page.locator('.story-gallery').screenshot(path=str(out/f'cards-{width}-{height}-{motion}.png'))
                  assert page.locator('.product-tabs img').evaluate_all('(xs)=>xs.length===5&&xs.every(i=>i.complete&&i.naturalWidth>0&&i.currentSrc.includes("@2x"))')
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
                  for i in range(5):
                      if motion=='no-preference':
                          # Return from each product panel exactly as a visitor would.
                          page.locator('.nav-cta').click();page.wait_for_function('!document.querySelector(".story-gallery").inert',timeout=5000)
                          page.wait_for_timeout(300)
                      tab=page.locator('.product-tab').nth(i)
                      tab.click(timeout=15000);expect(tab).to_have_attribute('aria-selected','true',timeout=5000)
                      expect(page.locator('#'+tab.get_attribute('aria-controls'))).to_be_visible()
                  assert not errors,errors
                  results.append({'width':width,'height':height,'motion':motion,'imagesLoaded':5,'selections':5,'overflow':False,'pageErrors':errors})
                  (out/'browser-qa.json').write_text(json.dumps(results,indent=2));page.close()
              browser.close()
          print(json.dumps(results,indent=2))
          shutil.copytree('public/assets/products/editorial-v2',out/'editorial-v2')
          sheet=Image.new('RGB',(1740,1000),'#080c12');d=ImageDraw.Draw(sheet)
          f=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',23)
          d.text((42,30),'MARKETDECK / PRODUCT ARTWORK',font=f,fill='#edf1f6')
          for i,(name,label) in enumerate(zip(['stockproof','charting','fno','commentary','crypto'],['StockProof','Charting','F&O','Commentary','Crypto World'])):
              x=42+i*560 if i<3 else 322+(i-3)*560;y=120 if i<3 else 560
              im=ImageOps.fit(Image.open(f'public/assets/products/editorial-v2/{name}.webp'),(536,306))
              sheet.paste(im,(x,y));d.text((x+4,y+322),label,font=f,fill='#edf1f6')
          sheet.save(out/'MarketDeck_Product_Artwork.jpg',quality=95)
          PY
      - name: Commit only final image bytes and manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/products/editorial-v2 docs/PRODUCT_ART_V2.md
          git diff --cached --check
          git commit -m 'Polish thumbnail edge continuity and verify final imagery'
          git push origin HEAD:assets/premium-product-art-20260923
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketdeck-product-art-release
          path: release-review/
          retention-days: 7
          if-no-files-found: error
