name: Verify live Intelligence shelf
on:
  push:
    branches: [feature/intelligence-shelf-20260923]
    paths: [.github/workflows/intelligence-live-check.yml]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 556ecc6e9ad02ae777d3c9746faf874f22658db8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify published HTML, CSS, JavaScript, reading URLs and preserved PDF
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          import json,hashlib,time,re
          out=Path('.preview/intel-live');out.mkdir(parents=True,exist_ok=True)
          def get(path):
              with urlopen(Request('https://marketdeck.in'+path,headers={'User-Agent':'MarketDeck-Intelligence-Release-Verification/1.0','Cache-Control':'no-cache'}),timeout=30) as response:
                  assert response.status==200,(path,response.status)
                  return response.read(),response.headers.get('content-type','')
          for attempt in range(12):
              html,_=get('/')
              if b'data-intel-shelf' in html and b'intelligence-shelf-v1.js' in html:break
              time.sleep(5)
          else:raise AssertionError('Live homepage is not the released shelf')
          paths=['/','/intelligence/','/intelligence/issues/','/intelligence/notes/business-before-the-stock/','/intelligence/notes/a-chart-is-a-question/','/intelligence/notes/five-research-lenses/','/intelligence/issues/agentic-trading-frontier-2026/']
          reports=[]
          for path in paths:
              body,kind=get(path);assert 'text/html' in kind
              assert b'research-foundations' not in body and b'EDITORIAL DRAFT' not in body
              if path=='/': assert body.count(b'data-intel-slide ')==4
              if path=='/intelligence/': assert body.count(b'data-intel-entry ')==4
              if path=='/intelligence/issues/': assert body.count(b'data-intel-entry ')==1
              reports.append({'path':path,'status':200,'contentType':kind})
          for path in ['/intelligence-shelf-v1.css','/intelligence-shelf-v1.js','/intelligence/issues/agentic-trading-frontier-2026/marketdeck-brief-v2.pdf']:
              body,kind=get(path)
              sha=hashlib.sha256(body).hexdigest()
              assert body==Path('public'+path).read_bytes(),('Unexpected published bytes',path)
              reports.append({'path':path,'status':200,'bytes':len(body),'sha256':sha,'contentType':kind})
          report={'commit':'556ecc6e9ad02ae777d3c9746faf874f22658db8','verifiedHTTPS':True,'checks':reports}
          (out/'http-report.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          PY
      - name: Live responsive interactions and screenshots
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python scripts/qa-intelligence-shelf.py --public --base https://marketdeck.in --out .preview/intel-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intelligence-live-verification
          path: .preview/intel-live/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
