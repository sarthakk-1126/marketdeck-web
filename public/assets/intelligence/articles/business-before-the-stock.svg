<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">Profit and the cash-conversion bridge</title><desc id="d">Hypothetical bridge: profit 100, depreciation plus 20, receivables minus 50, inventory minus 30, payables plus 10, operating-cash proxy 50. Figures in crore; other adjustments excluded.</desc><rect width="960" height="480" rx="16" fill="#0d1722"/><path d="M32 88H928" stroke="#2b3d4e"/><text x="32" y="39" font-family="Arial,sans-serif" font-size="15" fill="#8fbce2">MARKETDECK / RESEARCH EXAMPLE</text><text x="32" y="72" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">Profit and the cash-conversion bridge</text><rect x="48" y="185" width="108" height="165" rx="8" fill="#254e70"/><text x="57" y="171" font-family="Arial,sans-serif" font-size="26" fill="#edf1f6">100</text><text x="48" y="386" font-family="Arial,sans-serif" font-size="18" fill="#c8d6e5">Profit</text><rect x="193" y="152" width="108" height="33" rx="8" fill="#254e70"/><text x="202" y="138" font-family="Arial,sans-serif" font-size="26" fill="#edf1f6">+20</text><text x="193" y="386" font-family="Arial,sans-serif" font-size="18" fill="#c8d6e5">Depreciation</text><rect x="338" y="152" width="108" height="82.5" rx="8" fill="#4a6076"/><text x="347" y="138" font-family="Arial,sans-serif" font-size="26" fill="#edf1f6">−50</text><text x="338" y="386" font-family="Arial,sans-serif" font-size="18" fill="#c8d6e5">Receivables</text><rect x="483" y="234.5" width="108" height="49.5" rx="8" fill="#4a6076"/><text x="492" y="220.5" font-family="Arial,sans-serif" font-size="26" fill="#edf1f6">−30</text><text x="483" y="386" font-family="Arial,sans-serif" font-size="18" fill="#c8d6e5">Inventory</text><rect x="628" y="267.5" width="108" height="16.5" rx="8" fill="#254e70"/><text x="637" y="253.5" font-family="Arial,sans-serif" font-size="26" fill="#edf1f6">+10</text><text x="628" y="386" font-family="Arial,sans-serif" font-size="18" fill="#c8d6e5">Payables</text><rect x="773" y="267.5" width="108" height="82.5" rx="8" fill="#6cb7f4"/><text x="782" y="253.5" font-family="Arial,sans-serif" font-size="26" fill="#edf1f6">50</text><text x="773" y="386" font-family="Arial,sans-serif" font-size="18" fill="#c8d6e5">Cash proxy</text><path d="M44 350 L902 350" fill="none" stroke="#456987" stroke-width="3"/><text x="48" y="426" font-family="Arial,sans-serif" font-size="18" fill="#c8d6e5">₹ crore · deliberately simplified · not a statutory cash-flow statement</text></svg>