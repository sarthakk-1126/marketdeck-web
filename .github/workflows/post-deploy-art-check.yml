name: Verify live MarketDeck product artwork
on:
  push:
    branches: [assets/premium-product-art-20260923]
    paths: [.github/workflows/post-deploy-art-check.yml]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5040cb34cf5faccf55da20a35ffc928259415ffb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public artwork links and exact image bytes over HTTPS
        run: |
          python - <<'PY'
          from urllib.request import urlopen,Request
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          import json,hashlib,difflib,re
          out=Path('live-review');out.mkdir(exist_ok=True);origin='https://marketdeck.in'
          def get(path):
              with urlopen(Request(origin+path,headers={'User-Agent':'MarketDeck-Public-Release-Check/1.0','Cache-Control':'no-cache'}),timeout=30) as r:
                  assert r.status==200,(path,r.status)
                  return r.read(),dict(r.headers)
          expected=Path('public/index.html').read_text();body,headers=get('/');html=body.decode()
          (out/'public-home.html').write_text(html);(out/'http-headers.json').write_text(json.dumps(headers,indent=2))
          diff='\n'.join(difflib.unified_diff(expected.splitlines(),html.splitlines(),fromfile='release',tofile='public'))
          (out/'edge-html-difference.txt').write_text(diff)
          products=json.loads(Path('src/site-data.json').read_text())['products']
          summary={'publicHTMLBytes':len(body),'rawHTMLEqual':html==expected,'editorialPathMentions':html.count('/assets/products/editorial-v2/'),'htmlTail':html[-1200:]}
          print(json.dumps(summary,indent=2))
          for p in products:
              assert f'src="{p["thumbnail"]}"' in html,('Missing released thumbnail',p['id'])
              assert f'srcset="{p["thumbnail"]} 1x, {p["thumbnail2x"]} 2x"' in html,('Missing retina srcset',p['id'])
              assert f'data-preview-src="{p["preview"]}"' in html,('Missing released preview',p['id'])
          assert html.count('Original editorial illustration. Preview only.')==5
          css,cssheaders=get('/home.css');(out/'public-home.css').write_bytes(css)
          assert css==Path('public/home.css').read_bytes(),'Public CSS does not match the release'
          root='/assets/products/editorial-v2/'
          expected_manifest=json.loads(Path('public'+root+'asset-manifest.json').read_text())
          manifest,_=get(root+'asset-manifest.json');assert json.loads(manifest)==expected_manifest
          def verify(item):
              name,entry=item;raw,h=get(root+name)
              assert hashlib.sha256(raw).hexdigest()==entry['sha256'],name
              kind=next((v for k,v in h.items() if k.lower()=='content-type'),'')
              assert 'image/webp' in kind,(name,kind)
              return {'file':name,'http':200,'bytes':len(raw),'sha256':entry['sha256'],'contentType':kind}
          images=list(ThreadPoolExecutor(max_workers=5).map(verify,expected_manifest['files'].items()))
          report={'commit':'5040cb34cf5faccf55da20a35ffc928259415ffb','httpsCertificateVerification':True,'homepageArtworkMatchesRelease':True,'cssMatchesRelease':True,'rawHTMLEqual':html==expected,'imageCount':len(images),'images':images}
          (out/'live-http-qa.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          PY
      - name: Capture live desktop and mobile presentation
        run: |
          python -m pip install playwright==1.56.0
          python - <<'PY'
          from playwright.sync_api import sync_playwright,expect
          from pathlib import Path
          import json
          out=Path('live-review');report=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(channel='chrome',args=['--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              for width,height,motion in [(1440,1000,'no-preference'),(390,844,'reduce')]:
                  page=browser.new_page(viewport={'width':width,'height':height},device_scale_factor=2,reduced_motion=motion)
                  errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
                  response=page.goto('https://marketdeck.in/#products',wait_until='networkidle');assert response.status==200
                  if motion=='no-preference':
                      page.locator('.nav-cta').click();page.wait_for_function('!document.querySelector(".story-gallery").inert',timeout=5000)
                  else:page.locator('.product-tabs').scroll_into_view_if_needed()
                  page.wait_for_timeout(700)
                  assert page.locator('.product-tabs img').evaluate_all('(xs)=>xs.length===5&&xs.every(i=>i.complete&&i.naturalWidth>0&&i.currentSrc.includes("/editorial-v2/")&&i.currentSrc.includes("@2x")&&getComputedStyle(i).objectPosition==="50% 50%")')
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
                  page.locator('.story-gallery').screenshot(path=str(out/f'MarketDeck_Live_Cards_{width}.png'))
                  for i in range(5):
                      if motion=='no-preference':
                          page.locator('.nav-cta').click();page.wait_for_function('!document.querySelector(".story-gallery").inert',timeout=5000)
                          page.wait_for_timeout(300)
                      tab=page.locator('.product-tab').nth(i);tab.click();expect(tab).to_have_attribute('aria-selected','true')
                  assert not errors,errors
                  report.append({'width':width,'motion':motion,'images':5,'selections':5,'overflow':False,'pageErrors':errors});page.close()
              browser.close()
          (out/'live-browser-qa.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketdeck-live-artwork-verification
          path: live-review/
          retention-days: 7
          if-no-files-found: error
