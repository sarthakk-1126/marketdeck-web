name: Verify seven article editorial release
on:
  push:
    branches: [editorial/seo-foundations-20260923]
    paths: [.github/workflows/seo-editorial-review.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore the reviewed renderer publication guards
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('scripts/articles.mjs');s=p.read_text()
          if hashlib.sha256(p.read_bytes()).hexdigest()=='eb19fc6dde9500c555eef6e73eb203eb7a9d15f42b8b09241dbc5a09d73f1247':
            s=s.replace('<meta name="description" content="${E(description)}">','<meta name="description" content="${E(description)}"><meta name="theme-color" content="#080c12">')
            s=s.replace('<meta name="twitter:card" content="summary_large_image">','')
            s=s.replace('>Skip to reading</a>','>Skip to article</a>').replace('aria-label="Reading navigation"','aria-label="Editorial navigation"')
            s=s.replace('<a href="/intelligence/editorial-policy/">Editorial standards ↗</a>','<a href="/intelligence/editorial-policy/">Editorial standards</a><a href="/intelligence/">All perspectives ↗</a>')
            start=s.index(" const meta=JSON.parse(readFileSync('content/articles/metadata.json'")
            end=s.index('  const path=`/intelligence/notes/',start)
            replacement=""" const metadata=JSON.parse(readFileSync('content/articles/metadata.json','utf8'));
           const manifest=JSON.parse(readFileSync('content/briefs.json','utf8'));
           const allowed=new Set(manifest.notes.filter(n=>n.publicationStatus==='published'&&n.approvedAt).map(n=>n.slug));
           const output=[];const metaMap=new Map(metadata.map(x=>[x.slug,x]));
           const write=(path,html)=>{const f=resolve(root,'.'+path+'index.html');mkdirSync(dirname(f),{recursive:true});writeFileSync(f,html);};
           for(const a of metadata){
            slug(a.slug);if(!allowed.has(a.slug)||a.publicationStatus!=='published'||!a.approvedAt)throw Error('Unapproved authored note');
            if(!a.topics.length||a.topics.some(t=>!TOPICS[t]))throw Error('Invalid article topic');
            if(a.source!==`content/articles/${a.slug}.md`)throw Error('Invalid article source path');
            if(new Set(a.sources.map(s=>s.id)).size!==a.sources.length)throw Error('Duplicate sources');a.sources.forEach(s=>url(s.url));url(a.coverArt);if(!existsSync(resolve('public','.'+a.coverArt)))throw Error('Missing cover artwork');
          """
            s=s[:start]+replacement+s[end:];p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='8bcb67155769902e200e5fd7a6af1901d891616fcd5120ea77c45146e8af261d','Reviewed renderer mismatch'
          PY
      - name: Check reviewed manuscript and renderer integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          expected={
            'content/articles/a-chart-is-a-question.md':'32bb768dd1ccebf49761406eeffd323e559e24e654e5a07cb4ac829d5d9acf00',
            'content/articles/business-before-the-stock.md':'639f2253002dbd53a9775989864e8f553e20763f82160c9411005e5aa04135f2',
            'content/articles/crypto-fundamentals-fees-revenue-token-value.md':'b0433b8067f60d81200f1c5592e562b79062235a6b168e0dd708de2d8bb986e8',
            'content/articles/evaluate-ai-trading-agents.md':'e53f87a7249dad545d7415e297ea97c060c0997f3efc98b806924a7bc86d5015',
            'content/articles/five-research-lenses.md':'e18a5271b20fbe8dc489ace04aaf2f4431e0c432db827fff31e628b588b65555',
            'content/articles/iv-rank-vs-iv-percentile-nifty-options.md':'7d12b4b2fb9ff27cf5d1f3f04f6f822618ce7bbd9af80591bc63237c30cc2996',
            'content/articles/read-nse-company-announcements-results.md':'8ebed375a2012f67e5dedb65dfcbb7d5235c6c4f89132947a06b472f573632c5',
            'public/intelligence-article-v1.css':'11da71d5cd085209ad83708df822ff6e2380fe962ce1d4a52f005582b90b7e70',
            'scripts/articles.mjs':'8bcb67155769902e200e5fd7a6af1901d891616fcd5120ea77c45146e8af261d',
            'scripts/setup-seo-foundations.py':'252bf6a426e2990c81ecd2c1877b368dc59b666fc759ec35636f9144b1378923',
            'scripts/qa-seo-articles.py':'ada5ac437b2b7c4cf0b7960cf83eb16ce6919d5629362f0382a80662e22fb7de',
            'scripts/check-seo-preservation.py':'fef318c46fed017372c5e98c0744c8afd4c2a25592db0fe8cd91086d3af5fa45',
            'tests/articles.test.mjs':'ceef2a40db748df8348142469d3953f07f9c9f92b6d6537ec3fabc5746fbe21a'
          }
          for p,h in expected.items():
            actual=hashlib.sha256(Path(p).read_bytes()).hexdigest()
            assert actual==h,(p,actual,h)
          Path('.preview/seo-review').mkdir(parents=True,exist_ok=True)
          Path('.preview/seo-review/source-integrity.json').write_text(json.dumps(expected,indent=2))
          print('All 13 reviewed source files match.')
          PY
      - name: Integrate and build the existing editorial system
        run: |
          python scripts/setup-seo-foundations.py
          node scripts/build.mjs
          node scripts/build.mjs --review
          node --check scripts/articles.mjs
          node --check scripts/editorial.mjs
          node --test --test-concurrency=1 tests/*.test.mjs | tee .preview/seo-review/node-tests.txt
          python scripts/check-seo-preservation.py | tee .preview/seo-review/preservation.json
          git diff --check
      - name: Install QA-only browser and accessibility tools
        run: |
          python -m pip install playwright==1.56.0
          npm install --prefix /tmp/seo-a11y --no-audit --no-fund axe-core@4.11.0
      - name: Test real HTTP pages on desktop and mobile widths
        run: python scripts/qa-seo-articles.py --out .preview/seo-review --axe /tmp/seo-a11y/node_modules/axe-core/axe.min.js --widths 320,390,768,1440,1920
      - name: Commit only generated reviewed content to the feature branch
        run: |
          test "${GITHUB_REF_NAME}" = 'editorial/seo-foundations-20260923'
          git config user.name 'MarketDeck editorial build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/articles.mjs content/articles/metadata.json content/briefs.json scripts/editorial.mjs tests/intelligence.test.mjs tests/homepage.test.mjs public/index.html public/intelligence/index.html public/intelligence/notes public/intelligence/editorial-policy public/assets/intelligence/articles public/sitemap.xml
          git diff --cached --check
          git commit -m 'Build seven source-linked field guides and update the Intelligence library'
          git push origin HEAD:editorial/seo-foundations-20260923
      - name: Bundle publication evidence
        if: always()
        run: |
          mkdir -p .preview/seo-review/generated
          cp scripts/articles.mjs .preview/seo-review/
          cp -r public/intelligence public/assets/intelligence content/articles/metadata.json .preview/seo-review/generated/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-editorial-review
          path: .preview/seo-review/
          retention-days: 7
          if-no-files-found: error
