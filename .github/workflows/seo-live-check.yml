name: Verify live research article release
on:
  push:
    branches: [editorial/seo-foundations-20260923]
    paths: [.github/workflows/seo-live-check.yml]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3a9f30dbec2d37ae3906fd169e5184e41533d31
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check published pages, sitemap and unchanged PDF with verified HTTPS
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from concurrent.futures import ThreadPoolExecutor
          import json,hashlib,time,re,html
          origin='https://marketdeck.in'
          out=Path('.preview/seo-live');out.mkdir(parents=True,exist_ok=True)
          meta=json.loads(Path('content/articles/metadata.json').read_text())
          def get(path):
            with urlopen(Request(origin+path,headers={'User-Agent':'MarketDeck-Editorial-Release-Check/1.0','Cache-Control':'no-cache'}),timeout=30) as r:
              assert r.status==200,(path,r.status)
              return r.read(),dict(r.headers),r.geturl()
          for attempt in range(12):
            text,_,_=get('/intelligence/notes/a-chart-is-a-question/')
            if b'class="md-article"' in text:break
            time.sleep(5)
          else:raise AssertionError('Updated article is not publicly served')
          def verify(a):
            path='/intelligence/notes/'+a['slug']+'/'
            raw,headers,final=get(path);text=raw.decode()
            assert final==origin+path
            assert text.count('<h1>')==1 and html.escape(a['title']) in text
            assert 'href="'+origin+path+'"' in text
            assert 'class="a-body"' in text and 'Frequently asked questions' in text
            assert all('id="source-'+s['id']+'"' in text for s in a['sources'])
            assert not re.search(r'<meta[^>]+name="robots"[^>]+noindex',text,re.I)
            assert not any('noindex' in v.lower() for k,v in headers.items() if k.lower()=='x-robots-tag')
            ld=json.loads(re.search(r'<script type="application/ld\+json">([\s\S]*?)</script>',text).group(1))
            assert ld['@graph'][0]['wordCount']>=1500 and ld['@graph'][0]['@type']=='Article'
            fig='/assets/intelligence/articles/'+a['slug']+'.svg';image,_,_=get(fig)
            assert image==Path('public'+fig).read_bytes(),fig
            return {'slug':a['slug'],'http':200,'canonical':origin+path,'words':ld['@graph'][0]['wordCount'],'sources':len(a['sources']),'diagramHash':hashlib.sha256(image).hexdigest(),'robotsAllowsIndexing':True}
          articles=list(ThreadPoolExecutor(max_workers=4).map(verify,meta))
          css,_,_=get('/intelligence-article-v1.css');assert css==Path('public/intelligence-article-v1.css').read_bytes()
          sm,_,_=get('/sitemap.xml');assert all(('/intelligence/notes/'+a['slug']+'/').encode() in sm for a in meta)
          policy,_,_=get('/intelligence/editorial-policy/');assert b'No fictitious human analyst' in policy
          pdfpath='/intelligence/issues/agentic-trading-frontier-2026/marketdeck-brief-v2.pdf'
          pdf,_,_=get(pdfpath);assert pdf==Path('public'+pdfpath).read_bytes()
          report={'commit':'a3a9f30dbec2d37ae3906fd169e5184e41533d31','httpsCertificateVerification':True,'articles':articles,'cssExact':True,'sitemapContainsAllSeven':True,'preservedPDFHash':hashlib.sha256(pdf).hexdigest(),'indexingAndRankings':'Not verified; HTTP availability is not Google indexing.'}
          (out/'live-http-report.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          PY
      - name: Live mobile and desktop reading and library checks
        run: |
          python -m pip install playwright==1.56.0
          python scripts/qa-seo-articles.py --base https://marketdeck.in --out .preview/seo-live --widths 390,1440
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketdeck-seo-live-verification
          path: .preview/seo-live/
          retention-days: 7
          if-no-files-found: error
