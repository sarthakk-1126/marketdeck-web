<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">Constraint changes the frontier</title><desc id="d">Conceptual risk-return plane showing a long-only frontier, an unconstrained frontier that extends through shorting or leverage, and a neutral current-mix marker. Curves are schematic, not market data.</desc><rect width="960" height="480" rx="16" fill="#0d1722"/><path d="M32 88H928" stroke="#2b3d4e"/><text x="32" y="39" font-family="Arial,sans-serif" font-size="15" fill="#8fbce2">MARKETDECK / RESEARCH EXAMPLE</text><text x="32" y="72" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">Constraint changes the frontier</text><path d="M92 386 L900 386" fill="none" stroke="#456987" stroke-width="3"/><path d="M92 386 L92 96" fill="none" stroke="#456987" stroke-width="3"/><text x="704" y="424" font-family="Arial,sans-serif" font-size="16" fill="#c8d6e5">VOLATILITY →</text><text x="28" y="112" font-family="Arial,sans-serif" font-size="16" fill="#c8d6e5">RETURN ↑</text><path d="M145 350 C220 265 330 205 455 168 C585 130 710 120 858 132" fill="none" stroke="#72b9f9" stroke-width="5"/><path d="M122 360 C198 242 318 155 455 112 C615 62 746 72 875 88" fill="none" stroke="#8d9caf" stroke-width="3" stroke-dasharray="9 8"/><text x="608" y="151" font-family="Arial,sans-serif" font-size="16" fill="#9bc7ed">LONG-ONLY</text><text x="650" y="83" font-family="Arial,sans-serif" font-size="16" fill="#c8d6e5">UNCONSTRAINED</text><circle cx="390" cy="275" r="10" fill="#edf1f6"/><text x="410" y="282" font-family="Arial,sans-serif" font-size="15" fill="#edf1f6">CURRENT MIX</text><text x="535" y="447" font-family="Arial,sans-serif" font-size="15" fill="#c8d6e5">solid = no short weights · dashed = geometry may short / lever</text></svg>