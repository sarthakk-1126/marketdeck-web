name: Verify Intelligence shelf release
on:
  push:
    branches: [feature/intelligence-shelf-20260923]
    paths: [.github/workflows/intelligence-shelf-review.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed source integrity and integrate existing editorial generator
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          expected={'scripts/intelligence.mjs':'eefb808b5f42c8a0bbb3c3f1e68e99c996611b6d1a6d2bb1b036424ad9b85de1','public/intelligence-shelf-v1.css':'96b33f960d564c17d247a62846d920d39e4e41aa25b37ec1d074128cda924c7e','public/intelligence-shelf-v1.js':'5199a42fb04150128c1c1f647971adbb1fbf9c58899553e6737921eaa2d7b1e5','tests/intelligence.test.mjs':'c7f7ca18867e706554bbe75b5114c66fb60cd429404890db66e5f3cb43df56bc','tests/shelf-fixtures.mjs':'ffb23dc3b2d7c8bf7d3151a93b94b868ef0705bcc135929d819985198e3d36f5'}
          for path,sha in expected.items():
              actual=hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert actual==sha,(path,actual,sha)
          p=Path('content/briefs.json');m=json.loads(p.read_text())
          for i in m['issues']:
              if i['id']=='agentic-trading-frontier-02': i['topics']=['ai-quant','research-craft']
          m['notes']=[{'slug':'business-before-the-stock','topics':['equities','india'],'coverArt':'/assets/products/editorial-v2/stockproof.webp'},{'slug':'a-chart-is-a-question','topics':['markets','research-craft'],'coverArt':'/assets/products/editorial-v2/charting.webp'},{'slug':'five-research-lenses','topics':['research-craft','india'],'coverArt':'/assets/india-earth-small.webp'}]
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          p=Path('scripts/editorial.mjs');s=p.read_text()
          assert "from './intelligence.mjs'" not in s,'Fresh review checkout required'
          s="import {catalog,shelf,hub,archivePage} from './intelligence.mjs';\n"+s
          assert s.count('notes.push({path,title,summary});')==1
          s=s.replace('notes.push({path,title,summary});','notes.push({path,title,summary,slug:noteSlugs[notes.length],body});')
          start=s.index('  const notesHtml=');end=s.index("  writeFileSync(resolve(root,'sitemap.xml')",start)
          s=s[:start]+"  const collection=catalog(manifest,notes);\n  write('/intelligence/',hub(collection,{review}));\n  write('/intelligence/issues/',archivePage(collection,{review}));\n"+s[end:]
          start=s.index('  const brief=');end=s.index('  template=template.replace(/  <dialog',start)
          s=s[:start]+'''  const brief=shelf(collection);
            template=template.replace(/    <section class="brief-section"[\\s\\S]*?<\\/section>/,`<section class="brief-section"><div class="container">${brief}${data.newsletter.url?`<p class="newsletter-note"><a href="${esc(data.newsletter.url)}">Newsletter updates →</a></p>`:''}</div></section>`);
            template=template.replace('</head>','<link rel="stylesheet" href="/intelligence-shelf-v1.css"><script src="/intelligence-shelf-v1.js" defer></script></head>');
          '''+s[end:]
          p.write_text(s)
          p=Path('tests/homepage.test.mjs');s=p.read_text()
          old="assert.equal(hrefs.filter(h=>h.startsWith('/intelligence/notes/')).length,3);"
          assert s.count(old)==1
          p.write_text(s.replace(old,"assert.equal(new Set(hrefs.filter(h=>h.startsWith('/intelligence/notes/'))).size,3);"))
          print('Reviewed source hashes and scoped integration PASS')
          PY
          node scripts/build.mjs
          node scripts/build.mjs --review
          node --check scripts/intelligence.mjs
          node --check scripts/editorial.mjs
          node --check public/intelligence-shelf-v1.js
          node --test tests/*.test.mjs
      - name: Verify exact preservation outside the editorial area
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,re,json,hashlib
          old=subprocess.check_output(['git','show','HEAD:public/index.html'],text=True)
          new=Path('public/index.html').read_text()
          def strip(html):
              start=html.index('<section class="brief-section"')
              depth=0
              for match in re.finditer(r'<(/?)section\b[^>]*>',html[start:]):
                  depth+=-1 if match[1] else 1
                  if depth==0:
                      html=html[:start]+'SHELF'+html[start+match.end():];break
              return html.replace('<link rel="stylesheet" href="/intelligence-shelf-v1.css"><script src="/intelligence-shelf-v1.js" defer></script>','').strip()
          assert strip(old)==strip(new),'Homepage changed outside Brief section/assets'
          allowed={'content/briefs.json','scripts/editorial.mjs','tests/homepage.test.mjs','public/index.html','public/intelligence/index.html','public/intelligence/issues/index.html'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed<=allowed,changed-allowed
          oldm=json.loads(subprocess.check_output(['git','show','HEAD:content/briefs.json'],text=True));newm=json.loads(Path('content/briefs.json').read_text())
          for oldi,newi in zip(oldm['issues'],newm['issues']):
              assert oldi=={k:v for k,v in newi.items() if k!='topics'}
          print('Preservation PASS: globe, product cards, apps, existing notes, issue HTML/PDF, deployment and unrelated layouts unchanged')
          PY
      - name: Install QA-only browser tools
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          npm ci --ignore-scripts
          npm install --no-save --package-lock=false --ignore-scripts axe-core@4.10.3
      - name: Responsive interaction and accessibility checks
        run: |
          node tests/shelf-fixtures.mjs
          python -m http.server 4173 --directory public >/tmp/intel-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          python scripts/qa-intelligence-shelf.py --out .preview/intel-release
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json
          reports=[]
          with sync_playwright() as p:
              b=p.chromium.launch()
              for width in [390,1440]:
                  page=b.new_page(viewport={'width':width,'height':1000},reduced_motion='reduce')
                  for path,scope in [('/','[data-intel-shelf]'),('/intelligence/','body'),('/intelligence/issues/','body')]:
                      page.goto('http://127.0.0.1:4173'+path,wait_until='networkidle')
                      page.locator(scope).scroll_into_view_if_needed()
                      page.add_script_tag(path='node_modules/axe-core/axe.min.js')
                      result=page.evaluate("async selector => await axe.run(document.querySelector(selector), {runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa']}})",scope)
                      reports.append({'width':width,'path':path,'violations':result['violations']})
                      assert not result['violations'],json.dumps(result['violations'])
                  page.close()
              b.close()
          Path('.preview/intel-release/accessibility.json').write_text(json.dumps(reports,indent=2))
          print('Axe accessibility scan PASS: 6 cases')
          PY
          rm -rf public/__shelf-qa
      - name: Commit only tested generated integration files to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/briefs.json scripts/editorial.mjs tests/homepage.test.mjs public/index.html public/intelligence/index.html public/intelligence/issues/index.html
          git diff --cached --check
          test ! -d public/__shelf-qa
          git commit -m 'Integrate verified Intelligence shelf and generated editorial hub'
          git push origin HEAD:feature/intelligence-shelf-20260923
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intelligence-shelf-review
          path: .preview/intel-release/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
