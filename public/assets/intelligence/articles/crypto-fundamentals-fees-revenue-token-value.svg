<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">Follow the fee. Then follow the rights.</title><desc id="d">Synthetic fee allocation: $100 in user fees splits into $70 for service providers and $30 retained by the protocol. The retained $30 splits into $20 for the treasury and $10 for a tokenholder mechanism. This is not observed protocol data.</desc><rect width="960" height="480" rx="16" fill="#0d1722"/><path d="M32 88H928" stroke="#2b3d4e"/><text x="32" y="39" font-family="Arial,sans-serif" font-size="15" fill="#8fbce2">MARKETDECK / RESEARCH EXAMPLE</text><text x="32" y="72" font-family="Arial,sans-serif" font-size="27" fill="#edf1f6">Follow the fee. Then follow the rights.</text><path d="M230 235 L348 166" fill="none" stroke="#456987" stroke-width="3"/><path d="M230 255 L348 330" fill="none" stroke="#456987" stroke-width="3"/><path d="M578 323 L674 280" fill="none" stroke="#456987" stroke-width="3"/><path d="M578 337 L674 395" fill="none" stroke="#456987" stroke-width="3"/><rect x="40" y="196" width="190" height="100" rx="8" fill="#163653"/><text x="56" y="229" font-family="Arial,sans-serif" font-size="18" fill="#c8d6e5">User fees</text><text x="56" y="272" font-family="Arial,sans-serif" font-size="29" fill="#edf1f6">$100</text><rect x="348" y="116" width="230" height="100" rx="8" fill="#163653"/><text x="364" y="149" font-family="Arial,sans-serif" font-size="18" fill="#c8d6e5">Service providers</text><text x="364" y="192" font-family="Arial,sans-serif" font-size="29" fill="#edf1f6">$70</text><rect x="348" y="280" width="230" height="100" rx="8" fill="#163653"/><text x="364" y="313" font-family="Arial,sans-serif" font-size="18" fill="#c8d6e5">Protocol retained</text><text x="364" y="356" font-family="Arial,sans-serif" font-size="29" fill="#edf1f6">$30</text><rect x="674" y="230" width="242" height="100" rx="8" fill="#163653"/><text x="690" y="263" font-family="Arial,sans-serif" font-size="18" fill="#c8d6e5">Treasury</text><text x="690" y="306" font-family="Arial,sans-serif" font-size="29" fill="#edf1f6">$20</text><rect x="674" y="345" width="242" height="100" rx="8" fill="#163653"/><text x="690" y="378" font-family="Arial,sans-serif" font-size="18" fill="#c8d6e5">Holder mechanism</text><text x="690" y="421" font-family="Arial,sans-serif" font-size="29" fill="#edf1f6">$10</text></svg>